name = "cratefield-waitlist"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "worker-build --release"

[observability]
enabled = true

[vars]
ENV = "production"

# The Turnstile secret is a secret, not a var: `wrangler secret put
# TURNSTILE_SECRET`. Its widget is "Cratefield waitlist" on the Factory0
# account, sitekey 0x4AAAAAAEuliJdT2pRjYJtc, scoped to cratefield.com and
# www. The site sends the token; `build_captcha` binds the port and the
# expected hostname, so `production_readiness` is satisfied honestly and
# the `HARNESS_ALLOW_UNPROTECTED_WRITES` acceptance that used to sit here
# is gone (issue #143).

[[d1_databases]]
binding = "DB"
database_name = "cratefield-waitlist"
database_id = "7d3f9bef-1b23-400b-b462-f1f6c2e37d29"
migrations_dir = "migrations"

[[routes]]
pattern = "api.cratefield.com"
custom_domain = true
