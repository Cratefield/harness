[package]
name = "cratefield-tables-api"
description = "The HTTP API over a venture's declared tables: who may reach which rows, and the routes that serve them"
readme = "README.md"
keywords = ["cratefield", "tables", "crud", "access"]
categories = ["web-programming"]
include = ["src/**/*", "README.md"]
# Not published until the routes are built; the crate exists for the
# access decision they will consult.
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-tables = { path = "../tables" }
# For `Access` and `TablePrivacy`, the vocabularies a venture's manifest
# declares. A light crate — serde, serde_json, sha2 and `cratefield-tables`
# — so a runtime module depending on it pulls nothing a Worker cannot run.
cratefield-manifest = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
# A surface carries `schemars::Schema`; the table's own JSON Schema is a
# `serde_json::Value`, and this rewraps it.
schemars = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Path-only, like every other internal dev-dependency: `cargo publish`
# resolves dev-dependencies against crates.io, and a path-only one is
# stripped from the packaged manifest.
cratefield-testing = { path = "../testing", features = ["harness", "postgres"] }
tower = { workspace = true }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
# The subject-access and erasure routes, mounted beside a declared-tables
# module so the privacy declaration on a declared table is checked end to
# end rather than assumed.
cratefield-module-privacy = { path = "../module-privacy" }
pollster = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
