[package]
name = "cratefield-tables-api"
description = "The HTTP API over a venture's declared tables: who may reach which rows, and the routes that serve them"
readme = "README.md"
keywords = ["cratefield", "tables", "crud", "access"]
categories = ["web-programming"]
include = ["src/**/*", "README.md"]
# Not published until the routes are built; the crate exists for the
# access decision they will consult.
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-tables = { path = "../tables" }
# For `Access` and `TablePrivacy`, the vocabularies a venture's manifest
# declares. A light crate — serde, serde_json, sha2 and `cratefield-tables`
# — so a runtime module depending on it pulls nothing a Worker cannot run.
cratefield-manifest = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Path-only, like every other internal dev-dependency: `cargo publish`
# resolves dev-dependencies against crates.io, and a path-only one is
# stripped from the packaged manifest.
cratefield-testing = { path = "../testing" }
toml = { workspace = true }
serde = { workspace = true }
