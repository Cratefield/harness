# The deployable auth Worker (auth#41). One Worker + one D1 per environment,
# the shape of any harness venture (`examples/tables-canary` is one,
# generated and committed).
#
# needs-human before first deploy: `wrangler d1 create` for each environment
# and paste the ids below; set HARNESS_SECRET (+ HARNESS_SECRET_PREVIOUS on
# rotation), RESEND_API_KEY and TURNSTILE_SECRET as secrets per environment;
# add the auth.factory0.ventures custom domain on the Kontinuum Cloudflare
# account.
name = "factory0-auth"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true

# --- Staging (deployed from `main`) ---
# Workers Rate Limiting backs the harness's throttle: the admin-login
# floor, the `admin:ip:*` admin floor, and every guarded public write
# consult it, and readiness refuses the venture unless a limiter
# resolves (issue #437). `simple` allows 30 `limit()` calls per key per
# 60s window — the only supported shape; tune the limit if the venture's
# traffic outgrows it. Staging's namespace id is its own, so its
# counters never touch production's.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

[[d1_databases]]
binding = "DB"
database_name = "factory0-auth-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

# --- Production (deployed from a v* tag, behind the approval gate) ---
[env.production]
route = { pattern = "auth.factory0.ventures", custom_domain = true }

# The harness enforces its production rules against this, not against a
# compiled default (issue #143). Staging deliberately leaves it unset.
#
# The Turnstile secret is a secret, not a var: `wrangler secret put
# TURNSTILE_SECRET`. `build_captcha` binds the port and the expected
# hostname (`auth.factory0.ventures`, this Worker's own route), so
# readiness is satisfied honestly — the `HARNESS_ALLOW_UNPROTECTED_WRITES`
# acceptance this file used to tell operators to record is gone, and a
# missing secret is a deployment that says so, not an open form (issue
# #437).
#
# Production's limiter gets its own namespace id, so its counters stay
# independent of staging's.
[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

[env.production.ratelimits.simple]
limit = 30
period = 60

[env.production.vars]
ENV = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "factory0-auth-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"
