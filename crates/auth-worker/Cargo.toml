[package]
name = "cratefield-auth-worker"
description = "The deployable auth Worker: composes the auth modules into one harness venture, deployed as one branded instance per app"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The crate's own `fetch`/`scheduled` exports. A wrapper venture depends on
# this crate with `default-features = false` and exports its own instead, so
# the two do not collide on the same route (issue #646).
default = ["entry"]
entry = []

[lints]
workspace = true

[dependencies]
# Renamed so `src` reads `auth_core::AuthCore`, never the package's own name
# (issue #646): the venture name lives only in `defaults`.
auth_core = { package = "cratefield-auth-core", path = "../auth-core" }
auth_oidc = { package = "cratefield-auth-oidc", path = "../auth-oidc" }
auth_passkeys = { package = "cratefield-auth-passkeys", path = "../auth-passkeys" }
auth_magic_link = { package = "cratefield-auth-magic-link", path = "../auth-magic-link" }
auth_password = { package = "cratefield-auth-password", path = "../auth-password" }
auth_meta = { package = "cratefield-auth-meta", path = "../auth-meta" }
# The CF08 provider server: the account provider (Google, Apple, Meta) calls
# *us* for a subject's export and erasure over one signed HTTP contract, so
# this Worker is the provider side of issue #656's contract.
cratefield-module-privacy = { workspace = true }
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
cratefield-adapter-resend = { workspace = true }
cratefield-adapter-owlpost = { workspace = true }
cratefield-adapter-turnstile = { workspace = true }
worker = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
cratefield-testing = { workspace = true, features = ["postgres"] }
cratefield-adapter-sqlite = { workspace = true }
sea-query = { workspace = true }
auth_magic_link = { package = "cratefield-auth-magic-link", path = "../auth-magic-link" }
toml = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
