[package]
name = "cratefield-text-diff"
description = "Word-level diff (removed, added, same) in which protected ranges are atomic and reported as locked"
readme = "README.md"
keywords = ["cratefield", "diff", "text", "myers", "words"]
categories = ["text-processing"]
include = ["src/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# No diff crate: Myers' linear-space algorithm is ~100 lines here, and the
# tokeniser (protected ranges as single tokens) is the part that matters.
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
