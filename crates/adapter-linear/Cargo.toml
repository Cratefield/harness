[package]
name = "cratefield-adapter-linear"
description = "Tracker port over the Linear GraphQL API for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "linear", "tracker", "graphql", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The idempotency stamp folded into the description, exactly as the Jira
# adapter stamps its dedupe label: SHA-256 of the key, hex. Hashed so a
# caller's key — which may quote tenant data — never rides Linear as
# plain text.
sha2 = { workspace = true }
hex = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` (via cratefield-core)
# pulls in and which otherwise only a leaf crate selects, so that
# `cargo build --target wasm32-unknown-unknown -p cratefield-adapter-linear`
# stands on its own (issue #559, on the pattern of issue #178). The same
# line, for the same reason, is in cratefield-push-auth, cratefield-kms and
# the auth crates.
getrandom = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing", default-features = false, features = ["port-conformance"] }
pollster = { workspace = true }
# Signs the recorded webhook fixture in the inbound tests, exactly as Linear
# would (`Linear-Signature: <hex>` over the raw body).
hmac = { workspace = true }
# Derives the idempotency stamp the tests assert on, the same way the
# crate does — rather than a second hex helper that could drift from it.
hex = { workspace = true }
