[package]
name = "cratefield-adapter-owlpost"
description = "Mailer port over the Owlpost REST API for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "owlpost", "email", "mailer", "adapter"]
categories = ["email"]
include = ["src/**/*", "README.md"]
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` (via cratefield-core)
# pulls in and which otherwise only a leaf crate selects, so that
# `cargo build --target wasm32-unknown-unknown -p cratefield-adapter-owlpost`
# stands on its own (the pattern of issue #178, and the same line
# cratefield-adapter-jira carries).
getrandom = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest). Carries `sign_stripe_style`,
# which signs the webhook fixtures exactly as Owlpost would.
cratefield-testing = { path = "../testing", default-features = false, features = ["port-conformance"] }
pollster = { workspace = true }
time = { workspace = true }
