[package]
name = "cratefield-secrets"
description = "Cratefield harness secrets: envelope encryption over the Database port, two tiers, AAD-bound ciphertexts"
readme = "README.md"
keywords = ["cratefield", "harness", "secrets", "encryption", "envelope"]
categories = ["cryptography"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Opens the control database's global store to the control plane's own
# composition (the secrets-manager screen). Off by default, so a
# downstream builder of this published crate has no way to reach the
# global store without first asking for control-plane powers by name —
# the closest an additively-composed cargo feature can come to the
# `pub(crate)` proof that gates it in-repo.
control-plane = []

[dependencies]
cratefield-core = { workspace = true }
cratefield-kms = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
sea-query = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# Doctests only: the compile-fail case proving `SecretBytes` refuses a
# `Serialize` bound needs the trait in scope to name it (issue #39).
serde = { workspace = true }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
sea-query = { workspace = true }
pollster = { workspace = true }
# The shared-database suite opens the global store, which only the
# control-plane composition may — so the tests ask for the same feature
# by name.
cratefield-secrets = { path = ".", features = ["control-plane"] }
