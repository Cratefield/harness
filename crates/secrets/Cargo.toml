[package]
name = "cratefield-secrets"
description = "Factory Zero harness secrets: envelope encryption over the Database port, two tiers, AAD-bound ciphertexts"
readme = "README.md"
keywords = ["cratefield", "harness", "secrets", "encryption", "envelope"]
categories = ["cryptography"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-kms = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
sea-query = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# Doctests only: the compile-fail case proving `SecretBytes` refuses a
# `Serialize` bound needs the trait in scope to name it (issue #39).
serde = { workspace = true }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
sea-query = { workspace = true }
pollster = { workspace = true }
