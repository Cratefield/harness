[package]
name = "cratefield-module-orgs"
description = "Cratefield module: organizations, memberships, roles, invitations, service accounts, access grants and an audit log"
readme = "README.md"
keywords = ["cratefield", "organizations", "memberships", "authorization", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-mail-templates = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
# An invitation token reaches the database only as a SHA-256 hash, and the
# invitee's address likewise, so a dump or a query log holds nothing that can
# be replayed, or read back as an address.
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
# A service account key's 256 random bits (issue #878). Already in the graph
# through `cratefield-core`; named here for the direct call.
getrandom = { workspace = true }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declaration against the module that reads it (issue #265's pattern). A
# declaration is a promise about another crate's behaviour, so asserting the
# list against itself would prove none of it. Path-only, so it is stripped
# from the packaged manifest.
cratefield-module-privacy = { path = "../module-privacy" }
# The `postgres` feature unlocks the Postgres parity leg of the testing kit
# (issue #20); the leg itself only runs when FZ_TEST_POSTGRES_URL names a
# server. Dev-only, so it never reaches a venture's wasm graph.
cratefield-testing = { path = "../testing", features = ["postgres"] }
serde_json = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
