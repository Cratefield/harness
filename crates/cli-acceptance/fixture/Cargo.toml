[package]
name = "venture-fixture"
description = "Fixture venture for cratefield-cli tests (two modules, extensible)"
publish = false
version = "0.1.0"
edition = "2024"

# Standalone: not a workspace member (cratefield-cli-acceptance
# dev-depends on it by path).
[workspace]

[dependencies]
cratefield-core = { path = "../../core" }
cratefield-cli = { path = "../../cli" }
axum = { version = "0.8", default-features = false }

[[bin]]
name = "fz"
path = "src/fz_main.rs"
