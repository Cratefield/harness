# Acceptance tests for `fz` (issue #8): a separate workspace crate, not
# dev-dependencies of `factory0-cli`, because `cargo publish` resolves
# dev-dependencies against crates.io — a published `factory0-cli` could
# never verify with a fixture that is not itself published (issue #15).
[package]
name = "factory0-cli-acceptance"
description = "Acceptance tests for the fz CLI: fixture venture, collect/lockfile, doctor, modules"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Runs `fz migrations apply` and `fz data import` against a real Postgres
# (issues #18, #21); needs FZ_TEST_POSTGRES_URL at test time. Test-only
# crate (publish = false): sqlx/tokio are regular optional deps because
# dev-dependencies cannot be feature-gated.
postgres = [
    "factory0-cli/postgres",
    "dep:sqlx",
    "dep:tokio",
    "dep:factory0-adapter-postgres",
]

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
], optional = true }
tokio = { workspace = true, optional = true }
factory0-adapter-postgres = { workspace = true, optional = true }

[dev-dependencies]
factory0-core = { workspace = true }
factory0-cli = { workspace = true }
sha2 = { workspace = true }
venture-fixture = { path = "fixture" }
factory0-adapter-sqlite = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }
sea-query = { workspace = true }
axum = { workspace = true }
pollster = { workspace = true }
