# Acceptance tests for `fz` (issue #8): a separate workspace crate, not
# dev-dependencies of `cratefield-cli`, because `cargo publish` resolves
# dev-dependencies against crates.io — a published `cratefield-cli` could
# never verify with a fixture that is not itself published (issue #15).
[package]
name = "cratefield-cli-acceptance"
description = "Acceptance tests for the fz CLI: fixture venture, collect/lockfile, doctor, modules"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Runs `fz migrations apply` and `fz data import` against a real Postgres
# (issues #18, #21); needs FZ_TEST_POSTGRES_URL at test time. Test-only
# crate (publish = false): sqlx/tokio are regular optional deps because
# dev-dependencies cannot be feature-gated.
postgres = [
    "cratefield-cli/postgres",
    "dep:sqlx",
    "dep:tokio",
    "dep:cratefield-adapter-postgres",
]

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
], optional = true }
tokio = { workspace = true, optional = true }
cratefield-adapter-postgres = { workspace = true, optional = true }

[dev-dependencies]
cratefield-core = { workspace = true }
cratefield-cli = { workspace = true }
# The push environment guard (issue #191) takes the variable names from the
# one reader's table rather than writing them out, so a new variable is
# guarded the moment it joins the table.
cratefield-push-wiring = { workspace = true }
# `fz push vapid keygen`'s round trip (issue #184) is asserted **through the
# adapter**: the printed public key has to be the one `Vapid` derives from
# the stored private key, because that is the one presented as `k=` on every
# send. Re-deriving it in the test would only prove the CLI agrees with
# itself.
cratefield-adapter-webpush = { workspace = true }
sha2 = { workspace = true }
venture-fixture = { path = "fixture" }
cratefield-adapter-sqlite = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }
sea-query = { workspace = true }
axum = { workspace = true }
pollster = { workspace = true }
