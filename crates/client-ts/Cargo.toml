[package]
name = "cratefield-client-ts"
description = "The deterministic TypeScript client generator: a /__surface contract in, the files of a typed @cratefield/client package out"
readme = "README.md"
keywords = ["cratefield", "typescript", "codegen", "client"]
categories = ["development-tools", "web-programming"]
include = ["src/**/*", "README.md"]
# No longer held back: it is on crates.io and named in the ordered list
# in docs/RELEASING.md, and release-plz.toml carries no entry for it. The
# CLI consumes it — `fz client-ts` (issue #155).
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The `/__surface` types (`SurfaceDocument` and friends). serde-only in
# there, so this stays wasm-clean too.
cratefield-core = { workspace = true }
serde_json = { workspace = true }
# The composition hash, the same construction the manifest generator uses.
sha2 = { workspace = true }

[dev-dependencies]
# Path-only, like every internal dev-dependency: `cargo publish` resolves
# dev-dependencies against crates.io, and a path-only one is stripped from
# the packaged manifest. `TempDir` is what the TypeScript compile check
# writes the generated package into.
cratefield-testing = { path = "../testing" }
# Test-only, for one assertion: that the table-name rule in `contract.rs`
# (`is_table_name`) still agrees with its source of truth,
# `cratefield_tables::is_identifier` (`crates/tables/src/schema.rs:894`).
# Not a runtime dependency — `cratefield-tables` pulls `sea-query`, and
# this crate stays serde-only.
cratefield-tables = { path = "../tables" }
