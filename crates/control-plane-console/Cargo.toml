[package]
name = "cratefield-console"
description = "The control-plane console module: session guard, login skeleton, and the operator allowlist action"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-access = { path = "../control-plane-access" }
cratefield-accounts = { path = "../control-plane-accounts" }
cratefield-catalog = { path = "../control-plane-catalog" }
cratefield-provisioning = { path = "../control-plane-provisioning" }
axum = { workspace = true }
http = { workspace = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[dev-dependencies]
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
pollster = { version = "0.4", features = ["macro"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
