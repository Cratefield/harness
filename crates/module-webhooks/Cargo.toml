[package]
name = "cratefield-module-webhooks"
description = "Cratefield module: outbound webhook delivery — per-subject endpoints, HMAC-signed POSTs, exponential backoff, dead letters and replay"
readme = "README.md"
keywords = ["cratefield", "webhooks", "outbound", "hmac", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true, features = ["macros"] }
# HMAC-SHA256 over `{timestamp}.{body}`, the in-repo signing idiom
# (`cratefield-adapter-webhook-tracker` signs the same way, so one
# receiver-side verifier pattern covers both). Pure Rust, wasm-safe.
hmac = { workspace = true }
sha2 = { workspace = true }
# The per-endpoint signing secret is 32 bytes from the OS. Not otherwise
# called from this crate — it is here to pick getrandom's `wasm_js`
# backend, which `ulid` (via cratefield-core) pulls in and which otherwise
# only a leaf crate selects, so the wasm build of this crate stands on its
# own (the same line, for the same reason, is in the adapters and the auth
# crates).
getrandom = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing", features = ["postgres"] }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
async-trait = { workspace = true }
pollster = { workspace = true }
