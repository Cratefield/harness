[package]
name = "cratefield-session-grants"
description = "On-chain session grants: scoped, capped, expiring, revocable automation keys for ERC-4337/7579 Kernel, EIP-7702, Swig and Squads (issue #762)"
readme = "README.md"
keywords = ["cratefield", "erc-4337", "session-keys", "kernel", "swig"]
categories = ["authentication"]
include = ["src/**/*", "tests/**/*", "README.md"]
# Not on the venture-facing surface yet: like the auth-* and control-plane-*
# crates this is a server-side composition crate — ports, domain types, fakes
# and conformance suites for the harness's own automation keys, with no real
# network adapter on main to wire a facade feature to. When real
# Pimlico/ZeroDev/Swig adapters land and a venture needs to name the crate,
# flip this and add the facade feature, per the facade guard test.
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The fakes and the per-port conformance suites (`FakeBundler`,
# `MemoryGrantStore`, `conformance::grant_store_conformance`, ...). Off by
# default so a default build carries none of it; the crate's own
# integration tests turn it on through the self dev-dependency below, the
# way `cratefield-secrets` does for its `control-plane` feature.
testing = []

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# Pure library: no I/O stack of its own. The bundler adapter speaks JSON-RPC
# 2.0 over the injected `JsonRpcTransport`, so it runs on Workers and native
# unchanged, and the grant summary is serde so it can travel to the UI that
# renders it before the owner signs.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# RFC 3339 rendering of the validity window the summary shows the owner.
# Already a workspace dep on the wasm-bindgen line; wasm-safe.
time = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` (via cratefield-core)
# pulls in and which otherwise only a leaf crate selects, so that
# `cargo build --target wasm32-unknown-unknown -p cratefield-session-grants`
# stands on its own (the pattern of issue #178).
getrandom = { workspace = true }

[dev-dependencies]
cratefield-session-grants = { path = ".", features = ["testing"] }
pollster = { workspace = true }
serde_json = { workspace = true }
# The expiry and window tests move a clock in whole seconds and days.
time = { workspace = true }
