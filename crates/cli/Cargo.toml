[package]
name = "cratefield-cli"
description = "The fz CLI for Factory Zero ventures: migrations collect/apply, doctor, modules"
readme = "README.md"
keywords = ["cratefield", "cli", "migrations", "wrangler", "d1"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "examples/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `fz migrations apply --dialect postgres` (issue #18): pulls the
# native-only Postgres adapter and a tokio runtime to drive it. Opt-in so
# the default fz dependency graph stays free of sqlx and tokio — a
# venture's wasm build must never see them.
postgres = ["dep:cratefield-adapter-postgres", "dep:tokio"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
# `fz doctor` reads the push environment through the same `build_push` the
# runtimes do (issue #191), so the doctor and `serve()` cannot check different
# variable names. Pure Rust and native-safe: the push adapters speak HTTP
# through the `HttpClient` port and pull no tokio, sqlx or OpenSSL.
#
# **Not** optional, unlike `postgres` below, and the difference is deliberate.
# `fz` is built once and installed; a feature-gated doctor check is a doctor
# that silently checks less depending on how somebody's `fz` was compiled,
# which is the same class of invisible drift this crate exists to remove. The
# cost is that every `fz` links the three adapters and their crypto, and that
# `cratefield-push-wiring` must be first-published before `cratefield-cli`
# (docs/RELEASING.md).
cratefield-push-wiring = { workspace = true }
cratefield-manifest = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }
sea-query = { workspace = true }
cratefield-adapter-postgres = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
