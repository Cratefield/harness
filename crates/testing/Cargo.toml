[package]
name = "factory0-testing"
description = "Conformance kit for Factory Zero modules: fake ports, in-memory Database, request helpers"
readme = "README.md"
keywords = ["factory0", "conformance", "testing", "fakes", "harness"]
categories = ["development-tools::testing"]
include = ["src/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The Postgres parity leg (issue #20): pulls the native-only Postgres
# adapter and a private tokio runtime that drives its sqlx pool. Opt-in
# so the default factory0-testing dependency graph stays free of sqlx
# and tokio — a module's wasm build must never see them. Modules enable
# it on their factory0-testing dev-dependency; the Postgres leg itself
# only runs when FZ_TEST_POSTGRES_URL names a server.
postgres = ["dep:factory0-adapter-postgres", "dep:tokio"]

[dependencies]
factory0-core = { workspace = true }
factory0-adapter-sqlite = { workspace = true }
factory0-adapter-postgres = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
futures-core = { workspace = true }
pollster = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
