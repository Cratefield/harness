# Local dev server for testing the guarded console (the wizard, the dashboard)
# WITHOUT Cloudflare or a Google client: runs the console over the native
# runtime + in-memory SQLite. EXCLUDED from the workspace (native-only deps).
# Pinned to the same harness git rev as the console so cratefield-core unifies.
[package]
name = "cratefield-control-plane-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[[bin]]
name = "serve"
path = "src/main.rs"

[dependencies]
cratefield-core = { path = "../core" }
cratefield-runtime-native = { path = "../runtime-native" }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
cratefield-chrome = { path = "../control-plane-chrome" }
cratefield-console = { path = "../control-plane-console" }
cratefield-dashboard = { path = "../control-plane-dashboard" }
cratefield-accounts = { path = "../control-plane-accounts" }
# The secrets manager's wiring: LocalFileKms under a development key
# file, and the store API the seed writes through. The `control-plane`
# feature is named here too rather than inherited from the dashboard's
# dependency, so the dev server keeps opening the global store even if
# the dashboard ever changes how it asks for the fence.
cratefield-secrets = { path = "../secrets", features = ["control-plane"] }
cratefield-kms = { path = "../kms" }
# The seeded provisioning failure is written with a parameterised statement,
# so this needs the same value type the port speaks. Kept in step with the
# workspace pin.
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }
# The `Mailer` impl for the stderr dev mailer: the port trait is declared
# under `#[async_trait]`, so the impl needs the same macro in scope.
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
