[package]
name = "cratefield-adapter-colonizer"
description = "HTTP client for the Colonizer mothership API, for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "colonizer", "colony", "agent", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` (via cratefield-core)
# pulls in and which otherwise only a leaf crate selects, so that
# `cargo build --target wasm32-unknown-unknown -p cratefield-adapter-colonizer`
# stands on its own (the pattern of issue #178, and the same line
# cratefield-adapter-owlpost carries).
getrandom = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing" }
pollster = { workspace = true }
# The header-spy fake implements the `HttpClient` port's trait directly.
async-trait = { workspace = true }
time = { workspace = true }
