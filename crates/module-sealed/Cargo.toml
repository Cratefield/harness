[package]
name = "cratefield-module-sealed"
description = "Cratefield module: the server half of client-side sealed blobs — opaque ciphertext at rest, crypto-shred erasure, no server-side recovery path"
readme = "README.md"
keywords = ["cratefield", "sealed", "encryption", "zero-knowledge", "module"]
categories = ["web-programming", "cryptography"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-kms = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# AES-256-GCM for the outer wrap (defence in depth over the client's own
# ciphertext). Pure Rust, wasm-safe; the workspace pin keeps getrandom's
# RNG feature off, so the nonces are drawn through the crate's own
# getrandom dependency below.
aes-gcm = { workspace = true }
# Not otherwise called from this crate — it is here to pick getrandom's
# `wasm_js` backend, which `ulid` (via cratefield-core) pulls in and which
# otherwise only a leaf crate selects, so the wasm build of this crate stands
# on its own (the same line, for the same reason, is in `module-privacy` and
# the adapters).
getrandom = { workspace = true }

[dev-dependencies]
# The `postgres` feature unlocks the Postgres parity leg of the testing kit
# (issue #20); the leg itself only runs when FZ_TEST_POSTGRES_URL names a
# server.
cratefield-testing = { path = "../testing", features = ["postgres"] }
cratefield-module-privacy = { path = "../module-privacy" }
pollster = { workspace = true }
tower = { workspace = true }
