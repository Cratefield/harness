[package]
name = "cratefield-connections"
description = "Venture connections: customer credentials in the tenant secrets layer, with connected/invalid state"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-secrets = { workspace = true }
cratefield-catalog = { path = "../catalog" }
serde = { workspace = true }
sea-query = { workspace = true }

[dev-dependencies]
cratefield-kms = { workspace = true }
cratefield-adapter-sqlite = { git = "https://github.com/Cratefield/harness", rev = "b0858003713c5bc449ef617154ca375842ec1a4b" }
pollster = { version = "0.4", features = ["macro"] }
