[package]
name = "factory0-module-email-signup"
description = "Factory Zero module: email signup with double opt-in, unsubscribe, admin export"
readme = "README.md"
keywords = ["factory0", "signup", "email", "newsletter", "opt-in"]
categories = ["email"]
include = ["src/**/*", "migrations/**/*", "templates/**/*", "examples/**/*", "tests/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
factory0-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }
askama = { workspace = true }

[dev-dependencies]
http = { workspace = true }
serde_json = { workspace = true }
# The `postgres` feature unlocks the Postgres parity leg of the testing
# kit (issue #20); the leg itself only runs when FZ_TEST_POSTGRES_URL
# names a server. Dev-only, so it never reaches a venture's wasm graph.
factory0-testing = { workspace = true, features = ["postgres"] }
factory0-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
insta = { workspace = true }
bytes = { workspace = true }
