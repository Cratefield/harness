[package]
name = "cratefield-module-guardrails"
description = "Cratefield module: the policy engine every automated value-moving action must pass - hard denies, allowlists, required simulation, micro-USD caps, a kill switch and audit, default deny and fail closed"
readme = "README.md"
keywords = ["cratefield", "guardrails", "policy", "evm", "solana"]
categories = ["web-programming"]
include = ["src/**/*", "tests/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# `serde` so audit entries and caps serialise for sinks and config stores.
time = { workspace = true, features = ["serde"] }
# Lowercase-hex rendering of decoded EVM addresses (calldata recipients,
# revoke calldata) and 32-byte words.
hex = { workspace = true }
# Selects getrandom's `wasm_js` backend on wasm32, so the wasm build of this
# crate stands on its own (same line as `module-wallets` and `mail-templates`):
# `cratefield-core` reaches `ulid`/`getrandom`, and picking the backend is the
# leaf crate's job.
getrandom = { workspace = true }

[dev-dependencies]
cratefield-testing = { workspace = true }
# `pollster` runs the async engine in the integration tests, as the other
# modules' suites do.
pollster = { workspace = true }
# `time` renders the fixed instants the cap-window tests pin the clock to.
time = { workspace = true }
# The Turnkey deny-policy test compares against parsed JSON.
serde_json = { workspace = true }
# Keccak-256 to verify every hard-deny selector constant against the
# signature string it claims to be (issue #763). Same crate `module-wallets`
# uses for its EVM hashing.
sha3 = { workspace = true }
hex = { workspace = true }