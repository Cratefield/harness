[package]
name = "factory0-auth-core"
description = "Auth module: users, identities, credentials, sessions, single-use tokens, clients, client registration, redirect validation, sessions (issues #5-#8)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
askama = { workspace = true }
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
sea-query = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
argon2 = { workspace = true }
base64ct = { workspace = true }
getrandom = { workspace = true }
# Pinned here, not workspace-inherited: the workspace `p256` is 0.13.2 for
# `cratefield-adapter-apns`, and the login stack is a major ahead (ADR 0013).
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    # Apple hands out its signing key as a PKCS#8 PEM `.p8` file (#16), so
    # the minting path parses one rather than asking an operator to convert
    # a key by hand.
    "pkcs8",
    "pem",
] }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #265). A
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — so asserting the list against itself
# would prove none of it. Path-only, so it is stripped from the packaged
# manifest rather than resolved from crates.io.
cratefield-module-privacy = { path = "../module-privacy" }
# Same reason, for `tests/chooser_links.rs`: the login chooser's catalogue
# holds a path per method, and a path is a promise about another crate's
# router. Asserting the catalogue against itself would prove none of it.
# Path-only, so they are stripped from the packaged manifest. A dev-only
# cycle back to this crate is fine — cargo resolves dev-dependencies
# separately from the library graph.
factory0-auth-magic-link = { path = "../auth-magic-link" }
factory0-auth-password = { path = "../auth-password" }
factory0-auth-oidc = { path = "../auth-oidc" }
factory0-auth-meta = { path = "../auth-meta" }
cratefield-testing = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
