[package]
name = "cratefield-auth-core"
description = "Auth module: users, identities, credentials, sessions, single-use tokens, clients, client registration, redirect validation, sessions (issues #5-#8)"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
askama = { workspace = true }
cratefield-core = { workspace = true }
# `AUTH_LOCALES`/`Accept-Language`/`ui_locales` parsing and BCP 47 matching
# live in the i18n crate (issue #649). Pure Rust, wasm-safe, the same crate
# the template registry's negotiation is built around.
cratefield-i18n = { workspace = true }
# The two email-change mails of issue #648 are rendered through the same
# layout `auth-password` and `auth-magic-link` use, so a venture's mail
# looks the same whoever sent it.
cratefield-mail-templates = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
sea-query = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
argon2 = { workspace = true }
base64ct = { workspace = true }
bcrypt = { workspace = true }
getrandom = { workspace = true }
# Percent-decoding the `ui_locales` out of a pending `/authorize` query.
url = { workspace = true }
# Pinned here, not workspace-inherited: the workspace `p256` is 0.13.2 for
# `cratefield-adapter-apns`, and the login stack is a major ahead (ADR 0013).
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    # Apple hands out its signing key as a PKCS#8 PEM `.p8` file (#16), so
    # the minting path parses one rather than asking an operator to convert
    # a key by hand.
    "pkcs8",
    "pem",
] }
sha2 = { workspace = true }
thiserror = { workspace = true }
# An SSO connection's OIDC client secret is stored sealed with the harness's
# XChaCha20-Poly1305 sealer (ADR 0102), the same one `module-connections`
# uses for its provider tokens — never in the clear.
cratefield-oauth-client = { workspace = true }
# And the plaintext is held in a `Zeroizing` buffer for the short walk from
# the sealer to the token endpoint, so a rotated secret does not linger.
zeroize = { workspace = true }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #265). A
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — so asserting the list against itself
# would prove none of it. Path-only, so it is stripped from the packaged
# manifest rather than resolved from crates.io.
cratefield-module-privacy = { path = "../module-privacy" }
# Same reason, for `tests/chooser_links.rs`: the login chooser's catalogue
# holds a path per method, and a path is a promise about another crate's
# router. Asserting the catalogue against itself would prove none of it.
# Path-only, so they are stripped from the packaged manifest. A dev-only
# cycle back to this crate is fine — cargo resolves dev-dependencies
# separately from the library graph.
cratefield-auth-magic-link = { path = "../auth-magic-link" }
cratefield-auth-password = { path = "../auth-password" }
cratefield-auth-oidc = { path = "../auth-oidc" }
cratefield-auth-meta = { path = "../auth-meta" }
cratefield-testing = { workspace = true, features = ["postgres"] }
cratefield-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
# Only so the refresh-reuse grace tests (issue #655) can drive two
# exchanges at the same instant and prove the race is graced, not of the
# two-futures-at-once kind `pollster` alone cannot express.
futures-util = { workspace = true }
# The same tests wrap the harness database so a call yields to the
# executor once: the SQLite adapter answers on the first poll, which would
# otherwise serialize the two racing legs instead of interleaving them.
async-trait = { workspace = true }
