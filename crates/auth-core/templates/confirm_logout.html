<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign out? · Factory Zero</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0A0A0B; color: #EDEBE6;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(26rem, 92vw); padding: 2.5rem 2rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 .5rem; }
  p { color: #b7b3ab; margin: 0 0 1.75rem; }
  button.method {
    display: block; width: 100%; padding: .8rem 1rem; border-radius: .6rem;
    background: #17171a; color: #EDEBE6; font-weight: 550;
    border: 1px solid #26262b; transition: border-color .15s ease;
    font: inherit; font-weight: 550; cursor: pointer; text-align: center;
  }
  button.method:hover, button.method:focus-visible { border-color: #FF5A36; outline: none; }
  footer { margin-top: 2rem; color: #6f6c66; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Sign out of this device?</h1>
  <p>This ends the session on this device. Nothing else changes, and you
  can sign in again afterwards.</p>
  <form method="post" action="{{ action }}">
    {% if let Some(id) = client_id %}
    <input type="hidden" name="client_id" value="{{ id }}">
    {% endif %}
    {% if let Some(target) = post_logout_redirect_uri %}
    <input type="hidden" name="post_logout_redirect_uri" value="{{ target }}">
    {% endif %}
    <button class="method" type="submit">Sign out</button>
  </form>
  <footer>auth.factory0.ventures · Factory Zero</footer>
</main>
</body>
</html>
