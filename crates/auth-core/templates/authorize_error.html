<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in error · Factory Zero</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0A0A0B; color: #EDEBE6;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(26rem, 92vw); padding: 2.5rem 2rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 .75rem; }
  p { color: #b7b3ab; margin: 0 0 1.5rem; }
  code {
    display: inline-block; margin-top: .25rem; padding: .2rem .5rem;
    background: #17171a; border-radius: .4rem; color: #9b978f;
    font-size: .8rem; word-break: break-all;
  }
  footer { margin-top: 2rem; color: #6f6c66; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>That sign-in link could not be used</h1>
  <p>{{ message }} Nothing was redirected: an invalid sign-in request
  is never forwarded on to any application.</p>
  <code>request {{ request_id }}</code>
  <footer>auth.factory0.ventures · Factory Zero</footer>
</main>
</body>
</html>
