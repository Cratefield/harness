[package]
name = "cratefield-module-owlpost"
description = "Cratefield module: receives Owlpost's signed inbound-mail and delivery webhooks, deduplicates them and emits harness events"
keywords = ["cratefield", "owlpost", "email", "webhook", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "tests/**/*"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-adapter-owlpost = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cratefield-testing = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
