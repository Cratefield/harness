[package]
publish = false  # new crate: publish manually first, then wire into the facade
name = "cratefield-adapter-fcm"
description = "Push port over Firebase Cloud Messaging (FCM HTTP v1) for the Factory Zero harness"
readme = "README.md"
keywords = ["cratefield", "fcm", "push", "notifications", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# The service-account assertion (RS256) and the bearer-token cache. Signing
# lives there, shared with APNs and VAPID (#178) — never re-implemented here.
cratefield-push-auth = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The token exchange is the one form-encoded request in this crate
# (`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer`), so the encoding
# comes from the workspace pin rather than a hand-rolled percent-encoder.
serde_urlencoded = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# `Retry-After` also comes in the HTTP-date form, which needs a parsed
# calendar date to subtract the `Clock` port's `now` from.
time = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing" }
pollster = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
# The tests decode the assertion JWT's segments.
base64 = { workspace = true }
