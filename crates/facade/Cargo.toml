[package]
name = "cratefield"
description = "The Cratefield harness: one dependency that pulls in the core, a runtime, adapters and modules at versions known to work together"
readme = "README.md"
keywords = ["cratefield", "harness", "backend", "axum", "modules"]
categories = ["web-programming::http-server"]
include = ["src/**/*", "README.md"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Nothing but the core by default. A runtime is a deliberate choice, and
# an empty default keeps the wasm graph free of tokio and sqlx (ADR 0001).
default = []

# Runtimes. Pick one.
cloudflare = ["dep:cratefield-runtime-cloudflare"]
native = ["dep:cratefield-runtime-native"]

# Adapters.
sqlite = ["dep:cratefield-adapter-sqlite"]
postgres = ["dep:cratefield-adapter-postgres"]
resend = ["dep:cratefield-adapter-resend"]
turnstile = ["dep:cratefield-adapter-turnstile"]
anthropic = ["dep:cratefield-adapter-anthropic"]
openai-compatible = ["dep:cratefield-adapter-openai-compatible"]
apns = ["dep:cratefield-adapter-apns"]
fcm = ["dep:cratefield-adapter-fcm"]
stripe = ["dep:cratefield-adapter-stripe"]
webpush = ["dep:cratefield-adapter-webpush"]
# The Tracker port's three adapters: GitHub Issues and Jira Cloud (issue
# #559), and the HMAC-signed webhook a tenant configures.
github-issues = ["dep:cratefield-adapter-github-issues"]
webhook-tracker = ["dep:cratefield-adapter-webhook-tracker"]
jira = ["dep:cratefield-adapter-jira"]

# The portable classifier adapters (issue #456). `Classifier` over the
# operator's own TypeSafe API key (via `HttpClient`) and over the `TextModel`
# port. The third classifier adapter, workers-ai, is deliberately not a
# feature here: it depends on the `worker` crate and the `env.AI` binding,
# so a venture on Workers depends on it directly — the same way it already
# depends on the `cloudflare` runtime — and a native venture never pulls
# `worker` through this crate.
typesafe = ["dep:cratefield-adapter-typesafe"]
classifier-llm = ["dep:cratefield-adapter-classifier-llm"]

# The push adapters' provider tokens (ES256 for APNs and VAPID, RS256 for
# Google service accounts). Pulled in by `apns`, `fcm` and `webpush`
# already; a feature of its own for a venture that mints a provider token
# without any of those adapters.
push-auth = ["dep:cratefield-push-auth"]

# The runtime push wiring (issue #191): `build_push` and the one table of
# environment-variable names, plus `push_from_env()` on whichever runtime is
# enabled. Pulls all three push adapters, which is the point — the wiring
# answers which transports a venture configured, and an answer that depended
# on which adapters were compiled in would be a second place to drift.
push-wiring = [
    "dep:cratefield-push-wiring",
    "cratefield-runtime-cloudflare?/push",
    "cratefield-runtime-native?/push",
]

# Everything else that is optional.
ui = ["dep:cratefield-ui"]
# Server-side localisation (issue #190): Fluent catalogs, BCP 47
# negotiation and text direction. Pulled in by `notifications` already —
# a feature of its own for a venture that localises its own mail without
# mounting that module.
i18n = ["dep:cratefield-i18n"]
secrets = ["dep:cratefield-secrets"]
kms = ["dep:cratefield-kms"]
# The venture manifest and its composition generator (issue #138). A venture
# does not need it to run; `fz` reads it, and so does anything generating a
# composition from a manifest.
manifest = ["dep:cratefield-manifest"]
# The TypeScript client generator behind `fz client-ts` (issue #155).
client-ts = ["dep:cratefield-client-ts"]
# Reads a live database's catalog in cratefield-tables' vocabulary.
introspect = ["dep:cratefield-introspect"]
# Serves the tables a venture declares (issue #153). `fz build` turns it
# on for a venture whose manifest has a `[tables]` section, and leaves it
# off for one that does not — a venture with no declared tables has no use
# for the routes and should not carry them.
#
# Named for the alias rather than for the section: `cratefield::tables`
# would sit one word away from the generated venture's own
# `crate::tables` module, which is a different thing.
tables-api = ["dep:cratefield-tables-api"]
# Verifies auth-service tokens in a venture that has one (ADR 0016). The
# notifications module pulls it in already; a feature of its own for a venture
# that authenticates its own routes without mounting that module.
auth-client = ["dep:cratefield-auth-client"]
# OAuth 2.0 over the HttpClient port (issue #531). Not a dependency of any
# shipped module yet — `fz-module-linkedin` is private — so a venture that
# speaks to another OAuth provider turns it on itself.
oauth-client = ["dep:cratefield-oauth-client"]

# Modules shipped with the harness.
email-signup = ["dep:cratefield-module-email-signup"]
privacy = ["dep:cratefield-module-privacy"]
waitlist = ["dep:cratefield-module-waitlist"]
cms = ["dep:cratefield-module-cms"]
changelog = ["dep:cratefield-module-changelog"]
notifications = ["dep:cratefield-module-notifications", "i18n"]
telemetry = ["dep:cratefield-module-telemetry"]
webhooks = ["dep:cratefield-module-webhooks"]

# The conformance kit. Belongs under [dev-dependencies] in a venture.
testing = ["dep:cratefield-testing"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true, optional = true }
cratefield-runtime-native = { workspace = true, optional = true }
cratefield-adapter-sqlite = { workspace = true, optional = true }
cratefield-adapter-postgres = { workspace = true, optional = true }
cratefield-adapter-resend = { workspace = true, optional = true }
cratefield-adapter-turnstile = { workspace = true, optional = true }
cratefield-adapter-anthropic = { workspace = true, optional = true }
cratefield-adapter-openai-compatible = { workspace = true, optional = true }
cratefield-adapter-apns = { workspace = true, optional = true }
cratefield-adapter-fcm = { workspace = true, optional = true }
cratefield-push-auth = { workspace = true, optional = true }
cratefield-adapter-stripe = { workspace = true, optional = true }
cratefield-push-wiring = { workspace = true, optional = true }
cratefield-adapter-webpush = { workspace = true, optional = true }
# The Tracker port's three adapters, siblings under the port that lives in
# core (ADR 0002: the port there, the vendor clients here).
cratefield-adapter-github-issues = { workspace = true, optional = true }
cratefield-adapter-webhook-tracker = { workspace = true, optional = true }
cratefield-adapter-jira = { workspace = true, optional = true }

# The two portable classifier adapters (issue #456). `adapter-workers-ai` is
# absent on purpose: it needs the `worker` crate and the `env.AI` binding, so
# re-exporting it here would put `worker` on every native venture's graph.
# Ventures on Workers depend on it directly.
cratefield-adapter-typesafe = { workspace = true, optional = true }
cratefield-adapter-classifier-llm = { workspace = true, optional = true }
cratefield-ui = { workspace = true, optional = true }
cratefield-i18n = { workspace = true, optional = true }
cratefield-manifest = { workspace = true, optional = true }
cratefield-client-ts = { workspace = true, optional = true }
cratefield-introspect = { workspace = true, optional = true }
cratefield-tables-api = { path = "../tables-api", optional = true }
cratefield-auth-client = { workspace = true, optional = true }
cratefield-oauth-client = { workspace = true, optional = true }
cratefield-secrets = { workspace = true, optional = true }
cratefield-kms = { workspace = true, optional = true }
cratefield-module-email-signup = { workspace = true, optional = true }
cratefield-module-privacy = { workspace = true, optional = true }
cratefield-module-waitlist = { workspace = true, optional = true }
cratefield-module-cms = { workspace = true, optional = true }
cratefield-module-changelog = { workspace = true, optional = true }
cratefield-module-notifications = { workspace = true, optional = true }
cratefield-module-telemetry = { workspace = true, optional = true }
cratefield-module-webhooks = { workspace = true, optional = true }
cratefield-testing = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
