[package]
name = "cratefield"
description = "The Cratefield harness: one dependency that pulls in the core, a runtime, adapters and modules at versions known to work together"
readme = "README.md"
keywords = ["cratefield", "harness", "backend", "axum", "modules"]
categories = ["web-programming::http-server"]
include = ["src/**/*", "README.md"]
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Nothing but the core by default. A runtime is a deliberate choice, and
# an empty default keeps the wasm graph free of tokio and sqlx (ADR 0001).
default = []

# Runtimes. Pick one.
cloudflare = ["dep:cratefield-runtime-cloudflare"]
native = ["dep:cratefield-runtime-native"]

# Adapters.
sqlite = ["dep:cratefield-adapter-sqlite"]
postgres = ["dep:cratefield-adapter-postgres"]
resend = ["dep:cratefield-adapter-resend"]
turnstile = ["dep:cratefield-adapter-turnstile"]
apns = ["dep:cratefield-adapter-apns"]
fcm = ["dep:cratefield-adapter-fcm"]
stripe = ["dep:cratefield-adapter-stripe"]
webpush = ["dep:cratefield-adapter-webpush"]

# The push adapters' provider tokens (ES256 for APNs and VAPID, RS256 for
# Google service accounts). Pulled in by `apns` and by `fcm` already; a
# feature of its own for a venture that mints a VAPID token without either
# adapter.
push-auth = ["dep:cratefield-push-auth"]

# The runtime push wiring (issue #191): `build_push` and the one table of
# environment-variable names, plus `push_from_env()` on whichever runtime is
# enabled. Pulls all three push adapters, which is the point — the wiring
# answers which transports a venture configured, and an answer that depended
# on which adapters were compiled in would be a second place to drift.
push-wiring = [
    "dep:cratefield-push-wiring",
    "cratefield-runtime-cloudflare?/push",
    "cratefield-runtime-native?/push",
]

# Everything else that is optional.
ui = ["dep:cratefield-ui"]
# Server-side localisation (issue #190): Fluent catalogs, BCP 47
# negotiation and text direction. Pulled in by `notifications` already —
# a feature of its own for a venture that localises its own mail without
# mounting that module.
i18n = ["dep:cratefield-i18n"]
secrets = ["dep:cratefield-secrets"]
kms = ["dep:cratefield-kms"]
# The venture manifest and its composition generator (issue #138). A venture
# does not need it to run; `fz` reads it, and so does anything generating a
# composition from a manifest.
manifest = ["dep:cratefield-manifest"]

# Modules shipped with the harness.
email-signup = ["dep:cratefield-module-email-signup"]
privacy = ["dep:cratefield-module-privacy"]
waitlist = ["dep:cratefield-module-waitlist"]
cms = ["dep:cratefield-module-cms"]
notifications = ["dep:cratefield-module-notifications", "i18n"]

# The conformance kit. Belongs under [dev-dependencies] in a venture.
testing = ["dep:cratefield-testing"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true, optional = true }
cratefield-runtime-native = { workspace = true, optional = true }
cratefield-adapter-sqlite = { workspace = true, optional = true }
cratefield-adapter-postgres = { workspace = true, optional = true }
cratefield-adapter-resend = { workspace = true, optional = true }
cratefield-adapter-turnstile = { workspace = true, optional = true }
cratefield-adapter-apns = { workspace = true, optional = true }
# `publish = false` until its first manual publish (docs/RELEASING.md), so it
# must be published before the facade's next release, the same way
# `cratefield-push-auth` was.
cratefield-adapter-fcm = { workspace = true, optional = true }
# `publish = false` until its first manual publish (docs/RELEASING.md), so it
# must be published before the facade's next release — it is a dependency of
# `cratefield-adapter-apns` as well as of this crate.
cratefield-push-auth = { workspace = true, optional = true }
cratefield-adapter-stripe = { workspace = true, optional = true }
# `publish = false` until its first manual publish (docs/RELEASING.md), like
# the two push adapters it depends on.
cratefield-push-wiring = { workspace = true, optional = true }
# `publish = false` until its first manual publish (docs/RELEASING.md).
cratefield-adapter-webpush = { workspace = true, optional = true }
cratefield-ui = { workspace = true, optional = true }
# `publish = false` until its first manual publish (docs/RELEASING.md).
cratefield-i18n = { workspace = true, optional = true }
cratefield-manifest = { workspace = true, optional = true }
cratefield-secrets = { workspace = true, optional = true }
cratefield-kms = { workspace = true, optional = true }
cratefield-module-email-signup = { workspace = true, optional = true }
cratefield-module-privacy = { workspace = true, optional = true }
cratefield-module-waitlist = { workspace = true, optional = true }
cratefield-module-cms = { workspace = true, optional = true }
# `publish = false` until `factory0-auth-client` is published (ADR 0016),
# like the two push adapters and the wiring crate above.
cratefield-module-notifications = { workspace = true, optional = true }
cratefield-testing = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
