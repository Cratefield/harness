[package]
name = "fz-module-linkedin"
description = "Private Cratefield module: run a LinkedIn Company Page from the harness (OAuth connect, posts, media, showcase pages)"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }

# Nonces for the token seal. Split by target exactly as the harness's crypto
# spike does: on wasm getrandom needs the `wasm_js` opt-in, and that backend
# pulls wasm-bindgen, which is why the dependency is target-gated and never
# appears in the host `cargo tree` the conformance kit inspects.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #265). A
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — so asserting the list against itself
# would prove none of it. Path-only, so it is stripped from the packaged
# manifest rather than resolved from crates.io.
cratefield-module-privacy = { path = "../module-privacy" }
cratefield-testing = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
async-trait = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
