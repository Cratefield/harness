[package]
name = "fz-module-linkedin"
description = "Private Cratefield module: run a LinkedIn Company Page from the harness (OAuth connect, posts, media, showcase pages)"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# OAuth 2.0 and token sealing (issue #531): the connect flow, the refresh,
# and the AEAD the sealed token blobs are stored under all come from here.
cratefield-oauth-client = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# The optional fact check of commentary against its `source`: the protected
# spans and the check (with LinkedIn's mention and hashtag templates locked
# as caller spans), and the word diff a reviewer reads.
cratefield-text-guard = { workspace = true }
cratefield-text-diff = { workspace = true }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #265). A
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — so asserting the list against itself
# would prove none of it. Path-only, so it is stripped from the packaged
# manifest rather than resolved from crates.io.
cratefield-module-privacy = { path = "../module-privacy" }
cratefield-testing = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
async-trait = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
