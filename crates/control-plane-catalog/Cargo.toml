[package]
name = "cratefield-catalog"
description = "The module catalog and dependency resolution: which modules a customer may pick, and what pulls in what"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The modules the curated detail describes, so the detail is checked
# against them rather than trusted (`tests/detail_matches_the_modules.rs`).
# Dev-only: nothing in the control plane links a venture's modules, and a
# catalog entry is data about a module, not a dependency on one.
cratefield-core = { workspace = true }
cratefield-module-email-signup = { workspace = true }
cratefield-module-waitlist = { workspace = true }
cratefield-module-cms = { workspace = true }
cratefield-module-notifications = { workspace = true }
cratefield-module-privacy = { workspace = true }
# The same check, for the telemetry entry (issue #413). Path-only rather
# than `workspace = true` because `cargo publish` resolves dev-dependencies
# against crates.io too, and a path-only one is stripped from the packaged
# manifest — the rule `docs/RELEASING.md` states for every internal
# dev-dependency in this workspace.
cratefield-module-telemetry = { path = "../module-telemetry" }
