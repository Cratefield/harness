[package]
name = "cratefield-module-changelog"
description = "Cratefield module: mirror a project's GitHub releases (or CHANGELOG.md) into the venture's own database and serve them over an API"
readme = "README.md"
keywords = ["cratefield", "changelog", "releases", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
sea-query = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the read cache's key material: a fixed-length hash of the
# whole request fingerprint bounds the key without truncating it. Pure Rust,
# wasm-safe, already in the tree.
sha2 = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
cratefield-testing = { path = "../testing", features = ["postgres"] }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
async-trait = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
