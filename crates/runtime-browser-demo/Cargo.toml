[package]
name = "cratefield-runtime-browser-demo"
description = "Browser-runtime demo venture: 3 built-in modules, compiled to wasm"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-runtime-browser = { workspace = true }
cratefield-module-waitlist = { workspace = true }
cratefield-module-email-signup = { workspace = true }
cratefield-module-cms = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
cratefield-adapter-sqlite-wasm = { workspace = true }
getrandom = { workspace = true }
