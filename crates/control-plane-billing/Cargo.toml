[package]
name = "cratefield-billing"
description = "The control-plane billing model: the pricing tables from docs/control-plane/PRICING.md as data, and the Billing port a Stripe adapter will one day implement - Unwired today, so no venture's tier or invoice is ever a guess"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Deliberately none. The pricing model is data, the port is a trait, and
# `Unwired` refuses without touching anything: everything here must compile
# for the wasm Worker exactly as it compiles for the tests, and every
# dependency would be one more thing to carry across that line for no
# behaviour. The doc example is host-only and uses `std::fs` like the three
# doc generators this repo already ships.

[dev-dependencies]
# The Unwired port is async because a real adapter is; the tests drive the
# refusal the same way the provisioning crate drives its own.
pollster = { workspace = true }

