[package]
name = "cratefield-adapter-typesafe"
description = "Classifier port over the TypeSafe classify API for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "typesafe", "classifier", "adapter", "ai"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Path, not `workspace = true`: internal dev-dependencies are declared
# path-only so `cargo publish` never resolves them against crates.io
# (see the root manifest).
cratefield-testing = { path = "../testing" }
pollster = { workspace = true }
time = { workspace = true }

# A wasm leaf crate: getrandom (reached through core's `ulid` -> `rand`)
# needs the opt-in `wasm_js` backend on wasm32-unknown-unknown, enabled by
# unifying this target-scoped pin into the graph (see the root manifest).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
