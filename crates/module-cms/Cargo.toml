[package]
name = "factory0-module-cms"
description = "Factory Zero module: a small content store with an editor — typed collections, versioned, in the venture's own database"
readme = "README.md"
keywords = ["factory0", "cms", "content", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
factory0-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
sea-query = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
factory0-testing = { workspace = true, features = ["postgres"] }
factory0-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
