[package]
name = "cratefield-module-cms"
description = "Factory Zero module: a small content store with an editor — typed collections, versioned, in the venture's own database"
readme = "README.md"
keywords = ["cratefield", "cms", "content", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
sea-query = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
cratefield-testing = { path = "../testing", features = ["postgres"] }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
pollster = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
