[package]
name = "cratefield-signer"
description = "Cratefield harness signer: key-reference signing for wallet automation — guardrails, an audit chain, and keys that never leave the Secrets store"
readme = "README.md"
keywords = ["cratefield", "harness", "signing", "session-keys", "audit"]
categories = ["cryptography"]
include = ["src/**/*", "tests/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-secrets = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# Internal crates are path-only in dev-dependencies so a test always runs
# against this tree, never against a published copy.
cratefield-kms = { path = "../kms" }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
async-trait = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
