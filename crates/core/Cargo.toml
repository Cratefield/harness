[package]
name = "cratefield-core"
description = "Cratefield harness kernel: Module trait, Harness builder, ports, errors"
readme = "../../README.md"
keywords = ["cratefield", "harness", "backend", "axum", "modules"]
categories = ["web-programming", "asynchronous"]
include = ["src/**/*", "examples/**/*"]
# 0.3.0 (not workspace): the UI surface (`Module::surface`, `GET /__surface`,
# ADR 0010) adds a defaulted trait method and a root route.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sea-query = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
unicode-normalization = { workspace = true }
# One `origin_of` for the CSP builder and the VAPID `aud` (issue #215):
# RFC 6454 is not something to re-derive by splitting on "://".
url = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
pollster = { workspace = true }
futures-channel = { workspace = true }
insta = { workspace = true }
