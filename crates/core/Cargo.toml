[package]
name = "cratefield-core"
description = "Factory Zero harness kernel: Module trait, Harness builder, ports, errors"
readme = "../../README.md"
keywords = ["cratefield", "harness", "backend", "axum", "modules"]
categories = ["web-programming", "asynchronous"]
include = ["src/**/*", "examples/**/*"]
# 0.3.0 (not workspace): the UI surface (`Module::surface`, `GET /__surface`,
# ADR 0010) adds a defaulted trait method and a root route.
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes `Tenant::for_test`, so a crate outside core can construct the
# `&Tenant` a `TenantDatabases` impl is handed (issue #32). Opt-in and
# named, so enabling it is visible in review; belongs in
# `dev-dependencies`, which keeps it out of the published graph.
test-support = []

[dependencies]
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sea-query = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
pollster = { workspace = true }
futures-channel = { workspace = true }
insta = { workspace = true }
