[package]
name = "cratefield-core"
description = "Cratefield harness kernel: Module trait, Harness builder, ports, errors"
readme = "README.md"
keywords = ["cratefield", "harness", "backend", "axum", "modules"]
categories = ["web-programming", "asynchronous"]
include = ["src/**/*", "examples/**/*"]
# Not the workspace version: core versions independently of the crates that
# depend on it, and is ahead of them (release-plz.toml documents why that
# gap needs a deliberate dependent release round).
version = "0.8.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
# The bounded mpsc channel behind `stream::pump` (issue #859): how
# `stream_owned` hands a route handler a `'static` delta stream without
# spawning a task — the pump future that owns the model and the prompt is
# merged into the receiver and polled only when the output is, and
# dropping the output drops it, which is the cancellation contract.
# Wasm-safe. The "sink" feature is the `Sink` impl on the channel's
# `Sender` (issue #859) — without it `SinkExt::send` has nothing to extend.
futures-channel = { workspace = true, features = ["sink"] }
# The outbound budget's default sleeper (issue #765): the one timer that
# brings neither an executor nor a runtime dependency — `Delay` is a plain
# future. Not a workspace dependency on purpose: nothing else in the tree
# needs it, and core versions independently. It compiles for
# wasm32-unknown-unknown (the wasm gate holds) but cannot fire there — std
# has no monotonic timer on that target — so a runtime on wasm supplies a
# real sleeper through `BudgetedHttpClient::with_sleeper`.
futures-timer = "3"
# `futures_util::lock::Mutex` for the `/__health` sidecar probe cache's
# single-flight guard (harness.rs `probe_sidecars`): a std mutex cannot be
# held across the probe's awaits, and a std one that could would stall an
# executor thread for the length of the subrequest. Wasm-safe, and the same
# lock the GitHub App adapter single-flights its token exchange with.
# The extra "sink" feature is `SinkExt::send` on the pump's channel sender
# (issue #859): `stream_owned` pushes deltas through an mpsc, and `send` is
# the backpressured write. `futures-sink` is dependency-free and wasm-safe.
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
sea-query = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` pulls in and which
# otherwise only a leaf crate selects, so that
# `cargo check --target wasm32-unknown-unknown -p cratefield-core` stands on
# its own (issue #765). The same line, for the same reason, is in
# cratefield-push-auth, cratefield-kms and the auth crates.
getrandom = { workspace = true }
time = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
unicode-normalization = { workspace = true }
# One `origin_of` for the CSP builder and the VAPID `aud` (issue #215):
# RFC 6454 is not something to re-derive by splitting on "://".
url = { workspace = true }
# The `Tracker` port's `Credential` (issue #431) clears its token on drop,
# the same way `SecretBytes` in `cratefield-secrets` does — but core cannot
# depend on that crate (it depends on core), so `Zeroizing` is wrapped
# directly here.
zeroize = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
pollster = { workspace = true }
futures-channel = { workspace = true }
insta = { workspace = true }
# errors-doc parses every workspace crate's source for `ProblemDef`
# literals (issue #419); `span-locations` is what turns a found literal's
# span into the file:line a failure names. Both are already in the tree.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# Behaviour tests for the `api_key` store run against a real engine, the
# way `cratefield-testing`'s idempotency suite does (see
# tests/api_keys.rs); a dev-dependency never reaches the lib build, so
# the wasm boundary is untouched. Path-only on purpose: adapter-sqlite
# depends on core, so a versioned dev-dependency here would be a publish
# cycle (core first-publishes before it). `cargo publish` strips a
# path-only dev-dependency from the packaged manifest.
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
# Recomputing the stored digest in tests/api_keys.rs.
hex = { workspace = true }
