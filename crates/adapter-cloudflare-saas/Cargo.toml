[package]
name = "cratefield-adapter-cloudflare-saas"
description = "CustomHostnames port over the Cloudflare for SaaS custom-hostnames API for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "cloudflare", "saas", "custom-hostnames", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Nothing here draws randomness, but `cratefield-core`'s `ulid` reaches
# `getrandom` through `rand`, and picking `getrandom`'s `wasm_js` backend is
# the final crate's job in this workspace, so `cargo build --target
# wasm32-unknown-unknown -p cratefield-adapter-cloudflare-saas` stands on
# its own.
getrandom = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
