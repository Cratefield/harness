[package]
name = "cratefield-adapter-openai-compatible"
description = "TextModel port over the OpenAI chat-completions wire, at any base URL, for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "openai", "llm", "chat-completions", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# The trait the one-shot body stream a buffered synthesis wraps into a
# `ResponseStream` implements; the tiny stream itself is written out in
# `speech.rs`, the way core's own stream tests are.
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The streaming half of the TextModel port (issue #859): the delta stream
# is composed from core's `sse_events` with futures' stream adapters — the
# crate core already uses, so nothing new enters the tree. Purely
# combinators, no executor: wasm-safe like the rest of the crate.
futures-util = { workspace = true }
# Nothing here draws randomness, but `cratefield-core`'s `ulid` reaches
# `getrandom` through `rand`, and picking `getrandom`'s `wasm_js` backend is
# the final crate's job in this workspace, so `cargo build --target
# wasm32-unknown-unknown -p cratefield-adapter-openai-compatible` stands on
# its own.
getrandom = { workspace = true }

[dev-dependencies]
# Path-only (never `workspace = true` — see the rule comment at the root
# `Cargo.toml`): `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only dev-dependency is stripped from the packaged
# manifest. The default `harness` feature is on because
# `FakeHttpClient` lives behind it, the same as `adapter-anthropic`.
cratefield-testing = { path = "../testing" }
pollster = { workspace = true }
time = { workspace = true }
# The streaming tests drip body chunks through an mpsc channel the test
# holds the sender half of, which is what makes "a delta before the whole
# answer exists" and "dropping the stream drops the body" observable.
futures-channel = { workspace = true }
