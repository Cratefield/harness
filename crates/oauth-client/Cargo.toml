[package]
name = "cratefield-oauth-client"
description = "OAuth 2.0 for the harness: authorize URLs, code exchange, refresh and revocation over the HttpClient port, PKCE, and token sealing (issue #531)"
readme = "README.md"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# S256 challenges (RFC 7636) and the AEAD the token sealer uses (ADR 0102).
sha2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }

# Nonces and PKCE verifiers. Split by target exactly as the harness's crypto
# spike does: on wasm getrandom needs the `wasm_js` opt-in, and that backend
# pulls wasm-bindgen, which is why the dependency is target-gated and never
# appears in the host `cargo tree` the conformance kit inspects.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
async-trait = { workspace = true }
pollster = { workspace = true }
