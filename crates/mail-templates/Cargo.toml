[package]
name = "cratefield-mail-templates"
description = "Branded, email-client-safe HTML and plain-text mail for Cratefield ventures, themed with each venture's own website style"
readme = "README.md"
keywords = ["cratefield", "email", "templates", "html-email", "branding"]
categories = ["email", "template-engine"]
include = ["src/**/*", "tests/**/*", "README.md"]
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Nothing here draws randomness, but `cratefield-core`'s `ulid` reaches
# `getrandom` through `rand`, and picking `getrandom`'s `wasm_js` backend is
# the final crate's job in this workspace, so `cargo build --target
# wasm32-unknown-unknown -p cratefield-mail-templates` stands on its own.
getrandom = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
