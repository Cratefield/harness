[package]
name = "cratefield-adapter-apns"
description = "Push port over Apple Push Notification service (APNs) for the Factory Zero harness"
readme = "README.md"
keywords = ["cratefield", "apns", "push", "notifications", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# The provider JWT: signing and the mint-once cache moved out to the shared
# push-auth crate in #178, so VAPID and Google reuse them unchanged.
cratefield-push-auth = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing", default-features = false, features = ["port-conformance"] }
pollster = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
# The tests decode the JWT segments they assert on.
base64 = { workspace = true }
