[package]
name = "cratefield-adapter-jira"
description = "Tracker port over the Jira Cloud REST API for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "jira", "atlassian", "tracker", "adapter"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The idempotency label: `cratefield-idem-` + the first 16 bytes of
# SHA-256 of the draft's key, hex — the Jira counterpart of the GitHub
# adapter's invisible HTML comment.
sha2 = { workspace = true }
hex = { workspace = true }
# HTTP Basic over the tenant's `email:api_token` pair (Atlassian's
# API-token auth). Pure Rust, wasm-safe.
base64 = { workspace = true }
# Not called from this crate — nothing here draws randomness. It is here to
# pick getrandom's `wasm_js` backend, which `ulid` (via cratefield-core)
# pulls in and which otherwise only a leaf crate selects, so that
# `cargo build --target wasm32-unknown-unknown -p cratefield-adapter-jira`
# stands on its own (issue #559, on the pattern of issue #178). The same
# line, for the same reason, is in cratefield-push-auth, cratefield-kms and
# the auth crates.
getrandom = { workspace = true }

[dev-dependencies]
# Path-only on purpose: `cargo publish` resolves dev-dependencies against
# crates.io, and a path-only one is stripped from the packaged manifest
# (see the note in the workspace manifest).
cratefield-testing = { path = "../testing", default-features = false, features = ["port-conformance"] }
pollster = { workspace = true }
# Signs the recorded webhook fixture in the inbound tests, exactly as Jira
# Cloud would (`X-Hub-Signature: sha256=<hex>` over the raw body).
hmac = { workspace = true }
