[package]
name = "cratefield-adapter-sqlite-wasm"
description = "Browser SQLite (sqlite-wasm/OPFS) Database port for the Factory Zero harness"
readme = "README.md"
keywords = ["cratefield", "sqlite", "wasm", "browser", "opfs"]
categories = ["web-programming", "database"]
include = ["src/**/*", "js/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
async-trait = { workspace = true }
sea-query = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

# Browser-only: the JS/wasm bindings that back the port. Native builds of this
# crate are intentionally empty (the native SQLite adapter is
# `cratefield-adapter-sqlite`, over rusqlite).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `futures` feature gives `impl Future for SendWrapper<F>`, the sanctioned way
# to await a `!Send` JS future under the harness's `Send` `Database` trait on
# the single-threaded wasm isolate — keeps this crate free of `unsafe`
# (workspace forbids `unsafe_code`).
send_wrapper = { version = "0.6", features = ["futures"] }
getrandom = { workspace = true }
