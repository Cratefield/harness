[package]
name = "cratefield-tables"
description = "Declared tables for a Cratefield venture: the schema type, SQLite and Postgres DDL, row validation and a derived JSON Schema view"
readme = "README.md"
keywords = ["cratefield", "harness", "schema", "sql", "validation"]
categories = ["database", "web-programming"]
include = ["src/**/*", "corpus/**/*", "tests/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# The statements in `sql` are sea-query like every other module's SQL
# (ADR 0004). Already in the graph through `cratefield-core`, whose
# `Statement` carries a `sea_query::Values`; named here because this
# crate builds queries rather than only passing them along.
sea-query = { workspace = true }
serde = { workspace = true }
# `preserve_order` is required, not incidental: the JSON Schema view lists
# a table's properties in declaration order, and a `serde_json::Map`
# without this feature is a `BTreeMap` that sorts them alphabetically
# instead. The workspace already unified the feature in — through
# `schemars`, pulled by `cratefield-core` — so declaring it changes
# nothing here today and stops this crate's published output depending on
# another crate's choice of feature.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
# Dev-only, and the one dependency this crate adds to the workspace. The
# `[tables]` section is TOML in the venture manifest, so the documented
# fragment is parsed by a real TOML parser in the tests rather than
# retyped as JSON and asserted by hand. Never in the wasm graph: a
# dev-dependency is not built for `cargo build --target wasm32-*`.
toml = "0.9"
