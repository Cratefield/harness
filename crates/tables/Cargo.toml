[package]
name = "cratefield-tables"
description = "Declared tables for a Cratefield venture: the schema type, SQLite and Postgres DDL, row validation and a derived JSON Schema view"
readme = "README.md"
keywords = ["cratefield", "harness", "schema", "sql", "validation"]
categories = ["database", "web-programming"]
include = ["src/**/*", "corpus/**/*", "tests/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Dev-only, and the one dependency this crate adds to the workspace. The
# `[tables]` section is TOML in the venture manifest, so the documented
# fragment is parsed by a real TOML parser in the tests rather than
# retyped as JSON and asserted by hand. Never in the wasm graph: a
# dev-dependency is not built for `cargo build --target wasm32-*`.
toml = "0.9"
