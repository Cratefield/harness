[package]
name = "cratefield-dashboard"
description = "The control-plane dashboard module (issue #11): a live account's ventures, honestly rendered — never a failing venture that looks like a loading one"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-accounts = { path = "../control-plane-accounts" }
cratefield-connections = { path = "../control-plane-connections" }
cratefield-console = { path = "../control-plane-console" }
cratefield-provisioning = { path = "../control-plane-provisioning" }
# The module set the screen offers is the catalogue's, not a free-text box.
cratefield-catalog = { path = "../control-plane-catalog" }
# The billing screen's model and port: the pricing tables sourced from
# docs/control-plane/PRICING.md, and the Unwired Billing port whose
# refusal is the honest tier verdict.
cratefield-billing = { path = "../control-plane-billing" }
# The data screen's schema source: the live catalog, read over the db port
# and answered in the tables vocabulary.
cratefield-introspect = { path = "../introspect" }
# The schema vocabulary the diagram renders, shared with the tables
# contract a venture will one day publish (harness #153).
cratefield-tables = { path = "../tables" }
# The page shell, the stylesheet and the escaping every control-plane
# screen shares.
cratefield-chrome = { workspace = true }
# The secrets manager screen. The `control-plane` feature is the fence:
# it is what lets this crate open the control database's global store,
# and no venture composition enables it.
cratefield-secrets = { workspace = true, features = ["control-plane"] }
# The KMS port, so the composition can hand the screen a key manager (or
# honestly none). LocalFileKms itself is wired by the dev server, not
# here: this crate only names the trait.
cratefield-kms = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
sea-query = { workspace = true }
bytes = { workspace = true }
# The venture health checks are polled together rather than queued, so the
# page costs the slowest check and not the sum of all of them.
futures-util = { workspace = true }
# The venture's own UI contract, fetched from its /__surface and rendered.
serde_json = { workspace = true }
# Hostname normalisation for the domains screen: IDNA/punycode, so a
# customer's unicode hostname is stored as the ASCII name DNS uses.
idna = { workspace = true }
# The backups screen's export records a sha256 per table and for the
# whole file, in the `fz data export` shape.
sha2 = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[dev-dependencies]
cratefield-access = { path = "../control-plane-access" }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
cratefield-testing = { path = "../testing", features = ["postgres"] }
async-trait = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
