[package]
name = "cratefield-module-telegram"
description = "Cratefield module: the Telegram webhook, account linking, consent buttons with passkey confirmation, and a notifications channel"
readme = "README.md"
keywords = ["cratefield", "telegram", "bot", "webhook", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The notifications `Channel` (issue #764): `TelegramChannel` delivering to
# the linked chat. Off by default, so a venture that runs without the
# notifications module builds none of it.
notifications = ["dep:cratefield-module-notifications"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-adapter-telegram = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
# The notifications `Channel` trait is an async trait, like every port in
# core; the `StepUp` trait here is one for the same reason.
async-trait = { workspace = true }
# One-time link codes and action tokens: base64url (no pad, so a code fits
# Telegram's `start` parameter), SHA-256 for at-rest hashes, HMAC-SHA256 for
# the action-button tags (ADR 0006). Pure Rust, wasm-safe, already in the
# tree.
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# The at-rest form of a link code: lower-case SHA-256 hex, like every
# other hashed identifier in the tree.
hex = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
cratefield-module-notifications = { workspace = true, optional = true }

[dev-dependencies]
cratefield-testing = { path = "../testing" }
pollster = { workspace = true }
tower = { workspace = true }
