# Venture-side `fz` for the control plane (mirrors auth's). Native bin that
# links the venture's own harness so `fz migrations collect`/`doctor` see its
# modules. EXCLUDED from the workspace so the CLI's native-only deps never
# reach a wasm build. In-workspace path dependencies now (ADR 0013), so `cratefield-core`
# unifies into one type by construction.
[package]
name = "cratefield-control-plane-fz"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[[bin]]
name = "fz"
path = "src/main.rs"

[dependencies]
cratefield-core = { path = "../core" }
cratefield-cli = { path = "../cli" }
cratefield-chrome = { path = "../control-plane-chrome" }
cratefield-console = { path = "../control-plane-console" }
cratefield-dashboard = { path = "../control-plane-dashboard" }
