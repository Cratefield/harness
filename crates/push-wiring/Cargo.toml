[package]
name = "cratefield-push-wiring"
description = "Assembles the Push port for a Factory Zero venture from its environment: one env-variable table shared by serve(), fz push and fz doctor"
readme = "README.md"
keywords = ["cratefield", "push", "apns", "fcm", "web-push"]
categories = ["api-bindings", "config"]
include = ["src/**/*", "examples/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# All three push adapters, unconditionally: this crate exists to answer
# "which transports did this venture configure", and an answer that depended
# on which adapters were compiled in would be a second place for the three
# call sites to drift. Nothing here is native-only — every adapter speaks
# HTTP through the `HttpClient` port — so the crate reaches wasm32 whole.
cratefield-adapter-apns = { workspace = true }
cratefield-adapter-fcm = { workspace = true }
cratefield-adapter-webpush = { workspace = true }
# The offline `HttpClient` `inspect_push` hands the adapters (it is stored,
# never called) needs the port's request/response types.
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
