[package]
name = "factory0-auth-passkeys"
description = "Passkey registration and login for the Factory Zero auth service: pure-Rust WebAuthn relying-party verification on wasm32"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
factory0-core = { workspace = true }
# auth-core owns the schema (users, credentials, sessions, single_use_tokens)
# and publishes the typed store API the login-method modules write through.
# This is a dependency on its *published surface*, not on its internals.
factory0-auth-core = { path = "../auth-core" }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
base64ct = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

# WebAuthn, per ADR 0100: upstream webauthn-rs cannot build for wasm32
# (OpenSSL), so relying-party verification is implemented directly on the
# wire types plus pure-Rust CBOR/COSE and signature crates.
webauthn-rs-proto = { workspace = true }
ciborium = { workspace = true }
coset = { workspace = true }
url = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
factory0-testing = { workspace = true }
factory0-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
rand = "0.8"
