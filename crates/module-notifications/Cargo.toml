[package]
name = "cratefield-module-notifications"
description = "Cratefield module: push subscriptions, per-account per-category preferences, fan-out, prune and retry"
readme = "README.md"
keywords = ["cratefield", "notifications", "push", "apns", "module"]
categories = ["web-programming"]
include = ["src/**/*", "migrations/**/*", "tests/**/*", "README.md"]
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-mail-templates = { workspace = true }
# The catalog a `Localizable` message is rendered from, the BCP 47
# negotiation chain, and the text direction an `ar` mail needs (issue
# #190). A venture with one language never builds a catalog and pays
# only for the parse of a crate it does not call.
cratefield-i18n = { workspace = true }
# The account comes from the auth extractor, never from a body field
# (ADR 0016).
cratefield-auth-client = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
# The drain runs its provider round-trips a bounded number at a time
# instead of end to end. No threads and no runtime: `buffer_unordered` is
# the same single future on Workers as it is natively.
futures-util = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }
# The recipient hash that makes re-registration an upsert. Pure Rust,
# wasm-safe, already in the tree.
sha2 = { workspace = true }
# The provider's Svix webhook signature (#233) is verified by
# `cratefield-core`'s `webhook_signature` module (issue #533), so the HMAC
# crates themselves moved out of this crate's dependencies.

[dev-dependencies]
# Signing the fixture deliveries in tests/bounce.rs the way the provider
# does (HMAC-SHA256, base64-encoded in `svix-signature`).
hmac = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# The `postgres` feature unlocks the Postgres parity leg of the testing kit;
# the leg itself only runs when FZ_TEST_POSTGRES_URL names a server.
cratefield-testing = { path = "../testing", features = ["postgres"] }
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #244). The
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — and a test asserting the list against
# itself would prove none of it. A normal dependency would be backwards: this
# module knows nothing about privacy, and the privacy module knows nothing
# about any venture's tables.
cratefield-module-privacy = { path = "../module-privacy" }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
# Dev-only, and only so `tests/wiring.rs` can pin this module's copy of the
# three "this transport is wired" environment variable names against the
# crate that owns them. A normal dependency would drag all three push
# adapters into a module that must see the port trait and nothing else.
cratefield-push-wiring = { path = "../push-wiring" }
pollster = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
base64ct = { workspace = true }
# Mints the ES256 access tokens the route tests present. Pinned to the
# login stack's major (0.14), like `cratefield-auth-client` itself, so the
# test signs with the same curve implementation that verifies.
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    "pkcs8",
] }
