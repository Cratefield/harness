# The hosted control plane, served at https://console.cratefield.com.
#
# Two shapes in one file, the auth Worker's convention:
#
# - The top level is local development (`wrangler dev`): a local D1 whose
#   id is a placeholder, no route, no `ENV` (development), so nothing here
#   reaches a real account.
# - `[env.production]` is what `.github/workflows/deploy-control-plane.yml`
#   deploys (`wrangler deploy --env production`). Its D1 id is a
#   placeholder the workflow substitutes at deploy time with the id of the
#   `cratefield-control-plane` database, resolved (or created) by name —
#   no real id is committed. Owner steps: docs/control-plane/DEPLOY.md.
name = "cratefield-control-plane"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true

# The control plane's own cron, which is what makes the secrets screen's
# "next automatic rotation" a fact rather than a promise. `serve_scheduled`
# fans a firing out over this Worker's modules, and the dashboard's pass
# rotates every data key older than its store's policy. Nothing else
# triggers that handler, so without this the screen would name a date that
# nothing was ever going to act on — the failure the sidecar template's own
# cron comment warns about.
#
# Daily, in a quiet hour. The policy is measured in days, so a pass more
# often than daily would only re-read rows that are not due yet; the pass
# is safe at any cadence (it is the age that decides, not the trigger), so
# this is a cost choice rather than a correctness one.
[triggers]
crons = ["41 2 * * *"]

# Workers Rate Limiting backs the harness's throttle: the `admin:ip:*`
# floor on the allowlist invite and the console's magic-link budget both
# consult it, and in production readiness refuses every `/v1` route unless
# a limiter resolves (issue #437). `simple` allows 30 `limit()` calls per
# key per 60s window. Bindings are not inherited by environments, so
# production declares its own, with its own namespace id.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

[ratelimits.simple]
limit = 30
period = 60

[[d1_databases]]
binding = "DB"
database_name = "cratefield-control-plane"
database_id = "local-control-plane"
migrations_dir = "migrations"

# --- Production (deployed from `main` by deploy-control-plane.yml) ---
[env.production]
# The same script name as the top level, not wrangler's default
# `cratefield-control-plane-production`: there is one deployed control
# plane, and its name is the one the docs and the dashboard use.
name = "cratefield-control-plane"
workers_dev = false
# A Custom Domain, not a zone route: Cloudflare creates the proxied DNS
# record and the certificate for it, so the name resolves the moment the
# deploy lands. The `cratefield.com` zone must be on the same account.
routes = [{ pattern = "console.cratefield.com", custom_domain = true }]

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2002"

[env.production.ratelimits.simple]
limit = 30
period = 60

# `ENV` is what the harness enforces its production rules against (issue
# #143) — it also forbids `CONSOLE_DEV_LOGIN`. `CONSOLE_BASE_URL` is the
# public origin the magic link and the OAuth redirect URIs are built from.
# Secrets (HARNESS_SECRET, ADMIN_TOKEN, RESEND_API_KEY, the OAuth client
# secrets) are never vars: `wrangler secret put --env production`.
[env.production.vars]
ENV = "production"
CONSOLE_BASE_URL = "https://console.cratefield.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cratefield-control-plane"
database_id = "REPLACED_AT_DEPLOY_BY_WORKFLOW"
migrations_dir = "migrations"
