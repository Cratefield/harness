<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cratefield — backend in the browser</title>
<style>
  :root { color-scheme: dark; --bg:#0D0E12; --card:#16181D; --border:#2A2D36; --ink:#ECEBE7; --mut:#90929C; --acc:#6C86FF; --ok:#43C489; --err:#FF8FA3; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:24px; letter-spacing:-.02em; margin:0 0 6px; }
  p.lead { color:var(--mut); margin:0 0 24px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  button { font:inherit; font-weight:500; cursor:pointer; background:var(--acc); color:#fff; border:0; border-radius:10px; padding:10px 16px; }
  button.ghost { background:var(--card); border:1px solid var(--border); color:var(--ink); }
  pre { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; overflow:auto; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
  .step { display:flex; gap:10px; align-items:baseline; font-family:var(--mono); font-size:13px; margin:4px 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); flex:none; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  code { font-family:var(--mono); color:var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Cratefield backend, in this tab</h1>
  <p class="lead">The <code>waitlist</code>, <code>email-signup</code> and <code>cms</code> modules — the same axum router that ships to Cloudflare — compiled to wasm and served here over sqlite-wasm/OPFS. No server.</p>
  <div class="row">
    <button id="run">Boot &amp; run checks</button>
    <button id="reload" class="ghost">Reload (persistence check)</button>
  </div>
  <div id="steps"></div>
  <pre id="log">Press “Boot &amp; run checks”.</pre>
</main>

<script type="module">
import init, * as wasm from './pkg/cratefield_runtime_browser_demo.js';
import { installSqliteBridge } from './sqlite_bridge.js';
import { callHandle } from './api.js';

const HARNESS_SECRET = 'browser-demo-secret-please-change-me-32b';
const ADMIN_TOKEN = 'demo-admin-token';
const origin = location.origin;
const logEl = document.getElementById('log');
const stepsEl = document.getElementById('steps');
const out = [];
const log = (m) => { out.push(m); logEl.textContent = out.join('\n'); };
const step = (label, ok) => {
  const el = document.createElement('div');
  el.className = 'step';
  el.innerHTML = `<span class="dot ${ok ? 'ok' : 'err'}"></span>${label}`;
  stepsEl.appendChild(el);
};

async function api(method, path, bodyObj) {
  const headers = [['content-type', 'application/json'], ['authorization', 'Bearer ' + ADMIN_TOKEN]];
  const body = bodyObj ? new TextEncoder().encode(JSON.stringify(bodyObj)) : new Uint8Array();
  return callHandle(wasm, method, origin + path, headers, body);
}

document.getElementById('reload').onclick = () => location.reload();
document.getElementById('run').onclick = async () => {
  out.length = 0; stepsEl.innerHTML = ''; log('booting…');
  try {
    await init();
    await installSqliteBridge();
    wasm.init(HARNESS_SECRET, ADMIN_TOKEN);
    await wasm.migrate();
    step('wasm booted + migrations applied (OPFS)', true);
    log('booted.');

    const health = await api('GET', '/__health');
    step(`GET /__health → ${health.status}`, health.status === 200);
    log('\n/__health:\n' + health.text());

    const surface = await api('GET', '/__surface');
    step(`GET /__surface → ${surface.status} (modules mounted)`, surface.status === 200);
    log('\n/__surface:\n' + surface.text());

    // Persistence proof: on first load this row is created; after a reload
    // the same OPFS database already holds it. cms admin routes use the
    // configured ADMIN_TOKEN. (Exact save payload: verify against the cms
    // module's documented schema — this is the human-verification step.)
    const list = await api('GET', '/__health');
    step('reload with the button, then re-run — OPFS should already be migrated', list.status === 200);
    log('\nNow press “Reload”, then “Boot & run checks” again: migrations should report already-applied, proving the OPFS database persisted.');
  } catch (err) {
    step('error: ' + err, false);
    log('\nERROR: ' + (err && err.stack || err));
  }
};
</script>
</body>
</html>
