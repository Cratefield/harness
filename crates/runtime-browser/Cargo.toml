[package]
publish = false  # new crate: publish manually first, then wire into the facade
name = "cratefield-runtime-browser"
description = "In-browser runtime (wasm + sqlite-wasm/OPFS) for the Cratefield harness"
readme = "README.md"
keywords = ["cratefield", "wasm", "browser", "sqlite", "opfs"]
categories = ["web-programming", "wasm"]
include = ["src/**/*", "web/**/*", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
futures-core = { workspace = true }
time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cratefield-adapter-sqlite-wasm = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
getrandom = { workspace = true }

[dev-dependencies]
cratefield-adapter-sqlite = { workspace = true }
cratefield-module-waitlist = { workspace = true }
cratefield-module-email-signup = { workspace = true }
cratefield-module-cms = { workspace = true }
