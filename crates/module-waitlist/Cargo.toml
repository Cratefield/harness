[package]
name = "cratefield-module-waitlist"
description = "Cratefield module: per-product waitlist with confirm, position, referral codes"
readme = "README.md"
keywords = ["cratefield", "waitlist", "referral", "email", "module"]
categories = ["email", "web-programming"]
include = ["src/**/*", "migrations/**/*", "templates/**/*", "examples/**/*", "tests/**/*", "README.md"]
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }
askama = { workspace = true }

[dev-dependencies]
# Dev-only, and only so `tests/privacy.rs` can prove the personal-data
# declarations against the module that actually reads them (issue #265). A
# declaration is a promise about another crate's behaviour — what an export
# hands over, what an erasure deletes — so asserting the list against itself
# would prove none of it. Path-only, so it is stripped from the packaged
# manifest rather than resolved from crates.io.
cratefield-module-privacy = { path = "../module-privacy" }
http = { workspace = true }
serde_json = { workspace = true }
# The `postgres` feature unlocks the Postgres parity leg of the testing
# kit (issue #20); the leg itself only runs when FZ_TEST_POSTGRES_URL
# names a server. Dev-only, so it never reaches a venture's wasm graph.
cratefield-testing = { path = "../testing", features = ["postgres"] }
cratefield-adapter-sqlite = { path = "../adapter-sqlite" }
pollster = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
insta = { workspace = true }
