# release-plz configuration (issue #15, ADR 0005). Docs:
# https://release-plz.dev
#
# Per-crate versioning: every crate versions independently; release-plz
# bumps only the crates changed since their last release and rewrites
# the workspace dependency requirements it manages. Changelogs are
# generated per crate from conventional commits (feat/fix grouped,
# breaking changes highlighted — the git-cliff defaults).
#
# Breaking bumps cascade (issue #466): when release-plz rewrites a
# workspace dependency requirement itself, it patch-bumps every published
# crate that depends on the bumped one, transitively, and publishes them
# all in the same release PR, in dependency order — so per-crate
# versioning alone strands nothing. Hand-editing the
# `[workspace.dependencies]` requirement bypasses that: the requirement
# already reads correct in-tree, so release-plz rewrites nothing and
# strands every dependent silently, which is what the hand-done core 0.5
# bump did (issue #462). Rule: bump only the crate's own version, never
# the workspace requirement. Procedure: docs/RELEASING.md.

[workspace]
repo_url = "https://github.com/Cratefield/harness"

# Never published: the wasm example and the CLI acceptance suite exist
# only inside this repository.
[[package]]
name = "venture"
publish = false

[[package]]
name = "cratefield-cli-acceptance"
publish = false

# A measuring instrument, not a library: it exists to produce the numbers in
# docs/BENCHMARKS.md from this repository's own code (issue #156).
[[package]]
name = "cratefield-bench-write-ceiling"
publish = false

# Held back until the CRUD layer and the first in-repo consumer land.
# Nothing depends on it yet, and its public surface is still moving, which
# a 0.1 on crates.io would pin permanently. Its first publish is manual
# like every other new crate (docs/RELEASING.md), so leaving it in would
# only make the release run fail authentication over OIDC.
[[package]]
name = "cratefield-tables"
publish = false

# The TypeScript client generator (issue #155): the CLI now consumes it —
# `fz client-ts` generates the package from a served `/__surface` document —
# but its public surface is still new, and its first publish is manual like
# every other new crate (docs/RELEASING.md), so leaving it in would only
# make the release run fail authentication over OIDC. Held back for the
# same reason `cratefield-tables` above is.
[[package]]
name = "cratefield-client-ts"
publish = false
