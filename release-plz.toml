# release-plz configuration (issue #15, ADR 0005). Docs:
# https://release-plz.dev
#
# Per-crate versioning: every crate versions independently; release-plz
# bumps only the crates changed since their last release and rewrites
# the workspace dependency requirements it manages. Changelogs are
# generated per crate from conventional commits (feat/fix grouped,
# breaking changes highlighted — the git-cliff defaults).
#
# Does a breaking core bump release its dependents automatically? Not
# reliably. Assume it does not, and check (issue #462).
#
# release-plz does cascade by default: releasing a crate rewrites that
# crate's version requirement in the manifests it manages, and every crate
# whose requirement it rewrote earns a patch bump and is published in the
# same release PR. There is no setting for this — the cascade cannot be
# turned on, off or up.
#
# But the cascade is keyed on the rewrite, so a hand edit suppresses it.
# release-plz asks whether a requirement must change to admit the version
# being released, and reads "no change" as "this dependent needs no
# release". A requirement of "0.5" already admits 0.5.0, so releasing
# core as 0.5.0 against a workspace table that already reads "0.5"
# rewrites nothing and publishes nothing but core. That is how
# cratefield-core reached 0.5.0 on crates.io with 23 published dependents
# still requiring ^0.4: the requirement had been edited ahead of the
# release meant to move it.
#
# So bump one place, not two. Set the new version in
# crates/<name>/Cargo.toml and leave the [workspace.dependencies]
# requirement in the root Cargo.toml for release-plz to move.
#
# Second limit, also not configurable: a cascaded dependent gets a patch
# bump even when the dependency's change was breaking, because release-plz
# does not inspect code to see what a dependent re-exports. Note that
# docs/COMPATIBILITY.md will not show this: it is generated from the
# workspace manifests, so it describes this tree, not what the published
# crates require.
#
# docs/RELEASING.md has the full account and the recovery steps.

[workspace]
repo_url = "https://github.com/Cratefield/harness"

# Never published: the wasm example and the CLI acceptance suite exist
# only inside this repository.
[[package]]
name = "venture"
publish = false

[[package]]
name = "cratefield-cli-acceptance"
publish = false

# A measuring instrument, not a library: it exists to produce the numbers in
# docs/BENCHMARKS.md from this repository's own code (issue #156).
[[package]]
name = "cratefield-bench-write-ceiling"
publish = false

# The TypeScript client generator (issue #155): the CLI now consumes it —
# `fz client-ts` generates the package from a served `/__surface` document —
# but it is new and its public surface is still moving, which a 0.1 on
# crates.io would pin permanently. Its first publish is manual like every
# other new crate (docs/RELEASING.md), so leaving it in would only make the
# release run fail authentication over OIDC.
[[package]]
name = "cratefield-client-ts"
publish = false
