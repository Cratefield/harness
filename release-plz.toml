# release-plz configuration (issue #15, ADR 0005). Docs:
# https://release-plz.dev
#
# Per-crate versioning: every crate versions independently; release-plz
# bumps only the crates changed since their last release and rewrites
# the workspace dependency requirements it manages. Changelogs are
# generated per crate from conventional commits (feat/fix grouped,
# breaking changes highlighted — the git-cliff defaults).

[workspace]
repo_url = "https://github.com/Cratefield/harness"

# Never published: the wasm example and the CLI acceptance suite exist
# only inside this repository.
[[package]]
name = "venture"
publish = false

[[package]]
name = "cratefield-cli-acceptance"
publish = false

# Held back until the CRUD layer and the first in-repo consumer land.
# Nothing depends on it yet, and its public surface is still moving, which
# a 0.1 on crates.io would pin permanently. Its first publish is manual
# like every other new crate (docs/RELEASING.md), so leaving it in would
# only make the release run fail authentication over OIDC.
[[package]]
name = "cratefield-tables"
publish = false
