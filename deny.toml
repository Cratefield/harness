# cargo deny configuration (issue #1).
# Licenses: MIT / Apache-2.0 / BSD / ISC / Unicode allowlist, per the brief.
# Advisories: vulnerabilities deny (cargo-deny v2 field layout).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # foldhash (transitive via hashbrown/rusqlite) — OSI approved.
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
