# The private module workspace (issue #1). It mirrors the public harness
# (Cratefield/harness) rather than vendoring it: `factory0-*` crates come in as
# pinned git dependencies, `fz-*` crates live here and are never published
# (harness ADR 0005).
#
# The pin is a revision, not a tag: the public harness has not cut its first
# release yet (harness #15). Move it deliberately, never with a floating ref,
# so a core change can never land here by surprise.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/Factory-Zero/harness-private"

[workspace.dependencies]
# The public harness, pinned. `factory0-core` is the only harness dependency a
# module needs at runtime; the other two are test-only.
factory0-core = { git = "https://github.com/Cratefield/harness.git", rev = "a767deb6ddbf20b86abd825bc9e0c5d70309e688" }
factory0-testing = { git = "https://github.com/Cratefield/harness.git", rev = "a767deb6ddbf20b86abd825bc9e0c5d70309e688" }
factory0-adapter-sqlite = { git = "https://github.com/Cratefield/harness.git", rev = "a767deb6ddbf20b86abd825bc9e0c5d70309e688" }

# Versions match the public harness's workspace pins. Anything that differs
# here would resolve twice in a venture's graph.
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "query",
    "form",
    "matched-path",
] }
http = "1.5.0"
bytes = "1.12.1"
tower = { version = "0.5.3", features = ["util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }
time = { version = "0.3.45", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "wasm-bindgen",
] }
base64 = "0.23.1"
sha2 = "0.11.0"
# ADR 0102: XChaCha20-Poly1305, the AEAD the harness's secrets layer settled
# on. Used here to seal OAuth tokens at rest until that layer ships
# (Cratefield/harness #24), so the two never disagree about the primitive.
chacha20poly1305 = { version = "0.11", features = ["alloc", "zeroize"] }
zeroize = "1.8"
async-trait = "0.1.92"
pollster = { version = "0.4", features = ["macro"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
must_use_candidate = { level = "allow", priority = 1 }
