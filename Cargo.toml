[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "ventures/cratefield-waitlist"]
# `crates/cli-acceptance/fixture` is a fixture, not a package. The three
# venture-side `fz` binaries are excluded for the reason their own manifests
# give: they are native builds that link a venture's harness so
# `fz migrations collect` sees its modules, and their native-only
# dependencies (clap, rusqlite) must never reach a wasm build. Each was
# already excluded in its own repository before the consolidation.
exclude = [
    "crates/cli-acceptance/fixture",
    "crates/auth-fz",
    "crates/control-plane-fz",
    "crates/control-plane-dev",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Cratefield/harness"

[workspace.dependencies]
# Internal crates. cratefield-core is pinned with a caret on the current
# minor while pre-1.0 (issue #17): "0.3" accepts 0.3.x only, so a core
# minor bump can never silently mix with older modules and adapters.
# At 1.0 the range becomes "^1" (compatible within the major). The
# supported ranges per release are listed in docs/COMPATIBILITY.md.
# core is ahead of the other crates at 0.3.x: `well_known` + `Form` (#46),
# then the UI surface (`Module::surface`, `/__surface`, ADR 0010).
cratefield-core = { path = "crates/core", version = "0.3" }
cratefield-ui = { path = "crates/ui", version = "0.1.0" }
cratefield-kms = { path = "crates/kms", version = "0.1.0" }
cratefield-secrets = { path = "crates/secrets", version = "0.1.0" }
cratefield-runtime-cloudflare = { path = "crates/runtime-cloudflare", version = "0.1.0" }
cratefield-runtime-native = { path = "crates/runtime-native", version = "0.1.0" }
cratefield-runtime-browser = { path = "crates/runtime-browser", version = "0.1.0" }
cratefield-adapter-resend = { path = "crates/adapter-resend", version = "0.1.0" }
cratefield-adapter-turnstile = { path = "crates/adapter-turnstile", version = "0.1.0" }
cratefield-adapter-apns = { path = "crates/adapter-apns", version = "0.1.0" }
cratefield-adapter-fcm = { path = "crates/adapter-fcm", version = "0.1.0" }
# The provider tokens the push adapters present (issue #178): ES256 for APNs
# and VAPID, RS256 for Google service accounts, one keyed cache for all three.
cratefield-push-auth = { path = "crates/push-auth", version = "0.1.0" }
cratefield-adapter-stripe = { path = "crates/adapter-stripe", version = "0.1.0" }
# Web Push (issue #180): RFC 8030/8188/8291/8292 over the HttpClient port, for
# browsers and for the UnifiedPush distributors that speak the same protocol.
cratefield-adapter-webpush = { path = "crates/adapter-webpush", version = "0.1.0" }
# The runtime wiring for those three (issue #191): one table of environment
# variable names, one `build_push`, shared by `serve()`, `fz push` and
# `fz doctor` so they cannot drift on a name.
cratefield-push-wiring = { path = "crates/push-wiring", version = "0.1.0" }
cratefield-adapter-sqlite = { path = "crates/adapter-sqlite", version = "0.1.0" }
cratefield-adapter-sqlite-wasm = { path = "crates/adapter-sqlite-wasm", version = "0.1.0" }
# Phase 3 (issue #18): native-only Postgres adapter. Never a dependency of
# anything on the wasm path — CI asserts the venture wasm graph stays
# sqlx-free.
cratefield-adapter-postgres = { path = "crates/adapter-postgres", version = "0.1.0" }
cratefield-module-email-signup = { path = "crates/module-email-signup", version = "0.1.0" }
cratefield-module-privacy = { path = "crates/module-privacy", version = "0.1.0" }
cratefield-module-waitlist = { path = "crates/module-waitlist", version = "0.1.0" }
cratefield-module-cms = { path = "crates/module-cms", version = "0.1.0" }
# `publish = false` until `factory0-auth-client` is published: the
# notifications module is the first to depend on it, because the account a
# route acts for comes from the auth extractor (ADR 0016).
cratefield-module-notifications = { path = "crates/module-notifications", version = "0.1.0" }
# Server-side localisation (issue #190): Fluent catalogs, BCP 47
# negotiation and text direction. Nothing in it is notification-specific,
# so `module-waitlist`'s mail templates can take it next.
cratefield-i18n = { path = "crates/i18n", version = "0.1.0" }
cratefield-testing = { path = "crates/testing", version = "0.1.0" }
# The control plane's shared page chrome (cratefield.com's look, one copy).
cratefield-chrome = { path = "crates/control-plane-chrome", version = "0.1.0" }
cratefield-cli = { path = "crates/cli", version = "0.1.0" }
# The venture manifest + deterministic composition generator (issue #138).
# Depends only on serde/serde_json so both engines can consume it: the
# native compile engine (fz build) and, later, the wasm compose engine.
cratefield-manifest = { path = "crates/manifest", version = "0.1.0" }

# These entries carry a `version`, which is what makes them publishable as
# real dependencies. Internal **dev**-dependencies deliberately do NOT use
# `workspace = true`: they are declared path-only in the crate that needs
# them, because `cargo publish` resolves dev-dependencies against crates.io
# (the same trap `crates/cli-acceptance` was carved out to avoid). A
# path-only dev-dependency is stripped from the packaged manifest, which is
# what lets `cratefield-ui` dev-depend on the unpublished `module-hello`
# example and breaks the adapter-postgres -> module-* -> testing ->
# adapter-postgres cycle that would otherwise stall every release.

# HTTP stack. axum runs without tokio on Workers (ADR 0001): the `tokio`
# feature stays off, `default-features = false`, and only the extractor
# features modules need are enabled (`form` = form-encoded bodies for
# cross-site form_post callbacks, issue #46).
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "query",
    "form",
    "matched-path",
    # `nest` rewrites the URI a nested handler sees. A sidecar is a whole
    # harness serving its module at /v1/<name>, so the forwarder needs the
    # path the caller actually used (ADR 0009).
    "original-uri",
] }
http = "1.5.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
    "async-await",
    "std",
] }

# Serialization and diagnostics.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# IDNA/punycode for the dashboard's Domains screen: a customer's
# hostname is normalised to the ASCII form DNS uses on the way in.
# Already in the tree transitively via `url`; declared so the dashboard
# names it instead of relying on someone else's dependency. Pure Rust
# (icu4x), wasm-safe.
idna = "1.1.0"
# TOML manifest parsing for `fz build` (CLI-only; the manifest crate itself
# stays JSON/serde-only so it can compile to wasm for the compose engine).
toml = "0.8"
tracing = "0.1.44"

# SQL. sea-query 1.0 exists but the brief pins the stable 0.32 line (ADR 0004).
# `thread-safe` swaps SeaRc = Rc for Arc; without it query builders are !Send
# and cannot live in async handlers.
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }

# JSON Schema for the UI surface (ADR 0010): pure Rust, wasm-safe, default
# features plus `preserve_order`, so a schema lists properties in struct
# order and the renderer lays fields out as the author wrote them.
schemars = { version = "1.2.2", features = ["preserve_order"] }

# HTML for the UI renderer (ADR 0010): compile-time templates, string
# output, no runtime, wasm-safe.
maud = "0.27.0"

# Pure-Rust crypto (ADR 0006, and ADR 0102 for the AEAD). `zeroize`
# clears key material on drop; `chacha20poly1305` is the one AEAD the
# #38 spike found that builds for wasm32 without a C toolchain.
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
    "zeroize",
] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
subtle = "2.6.1"
# ES256 (P-256 ECDSA) for the APNs provider JWT (adapter-apns, #104). Pure
# Rust, wasm-safe; `ecdsa` signs with deterministic RFC6979 nonces so it
# needs no RNG on the isolate, and `pem`/`pkcs8` parse Apple's `.p8` key.
# `ecdh` is additive for every existing consumer: it adds
# `p256::ecdh::diffie_hellman`, which RFC 8291 needs to combine the server's
# ephemeral key with a browser subscription's `p256dh` (issue #180).
p256 = { version = "0.13.2", default-features = false, features = [
    "ecdsa",
    "ecdh",
    "pkcs8",
    "pem",
    "alloc",
] }
# HKDF-SHA256 for the RFC 8188 / RFC 8291 key schedule. Pinned to the 0.13
# line **because** that is the one built on `hmac` 0.13 / `digest` 0.11, the
# stack `hmac`/`sha2` above already pull in; 0.12 would drag a second digest
# stack (hmac 0.12 + sha2 0.10) into every build that touches Web Push.
hkdf = "0.13.0"
# AES-128-GCM, the one AEAD RFC 8188's `aes128gcm` content coding allows.
# 0.11 and not the 0.10 line for the same reason: it is built on `aead` 0.6 /
# `cipher` 0.5, which `chacha20poly1305` 0.11 above already brings, where 0.10
# would add `aead` 0.5 and a second cipher stack. It does not use `sha2` at
# all. `getrandom` stays off — the salt and the ephemeral key are drawn
# through the workspace's own `getrandom` pin, whose wasm backend is the leaf
# crate's job.
# `zeroize` for the same reason `chacha20poly1305` above carries it: the
# cipher clears its expanded AES round keys on drop, so a CEK that the
# adapter zeroizes does not survive inside the cipher it was handed to.
aes-gcm = { version = "0.11.1", default-features = false, features = [
    "aes",
    "alloc",
    "zeroize",
] }
# Email NFC normalisation (core `email` module) — pure Rust, wasm-safe.
unicode-normalization = "0.1.24"

# Project Fluent, for `cratefield-i18n` (issue #190). Pure Rust, no I/O,
# builds to wasm32, and `intl_pluralrules` ships the CLDR plural rules that
# make `{ $count ->  [one] … *[other] … }` correct per locale.
#
# `fluent-langneg` stays on the **0.13** line: 0.14 replaced `unic-langid`
# with `icu_locid` as its identifier type, which would put two
# `LanguageIdentifier` types and two locale databases in one dependency
# graph — `fluent-bundle` 0.16 is built on `unic-langid`.
fluent-bundle = "0.16.0"
fluent-langneg = "0.13.1"
unic-langid = "0.9.6"
# The **concurrent** memoizer (`Arc`/`RwLock`). The default `FluentBundle`
# is built on `Rc`/`RefCell` and is neither `Send` nor `Sync`, so it cannot
# live behind a `Push` or `Mailer` port; `SendWrapper` cannot fix that,
# because it grants `Send` alone and panics when dropped off-thread.
intl-memoizer = "0.5.3"

# Identifiers and time.
ulid = "3.0.0"
# Compiled mail templates for the modules (issue #12); pure build-time
# rendering, wasm-safe.
askama = "0.14.0"
# `wasm-bindgen` makes OffsetDateTime::now_utc() use JS Date on wasm;
# without it, now() panics ("time not implemented on this platform").
time = { version = "0.3.45", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "wasm-bindgen",
] }
# Enabled by wasm leaf crates: getrandom (via ulid/rand) needs the opt-in
# wasm_js backend on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }

# Traits and errors.
async-trait = "0.1.92"
thiserror = "2.0.20"

# Runtime and adapters.
# NOTE: the `http` feature stays OFF deliberately — with it enabled, D1
# writes hang under workerd/miniflare (worker 0.8.5, verified empirically).
# The `#[durable_object]` macro expands to a `wasm_bindgen` export, so a
# crate declaring a Durable Object class needs this directly (issue #103).
wasm-bindgen = "0.2"
worker = { version = "0.8.5", default-features = false, features = ["d1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.6", features = ["derive"] }
# Native-only async runtime for sqlx (`runtime-tokio`) — used by
# cratefield-adapter-postgres tests and, behind the `postgres` feature, the
# fz migration-apply path. Never enabled for a wasm target.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }

# Test-only.
insta = "1.48.0"
pollster = { version = "0.4", features = ["macro"] }
futures-channel = "0.3.34"

# --- Brought in with Factory-Zero/auth (ADR 0013). These are the login
# stack's own dependencies; nothing else in the workspace uses them.
# `p256` is deliberately absent: auth is on 0.14 and `cratefield-adapter-apns`
# on 0.13, so the four auth crates pin it directly rather than force a
# major bump on a published crate (issue: unify the two).
# Apple posts its authorization response as a form body (#16). axum parses
# one with this crate; the module parses it directly so a malformed body
# gets the module's own answer rather than axum's rejection text.
serde_urlencoded = "0.7.1"

# WebAuthn (ADR 0100): wire types plus pure-Rust CBOR/COSE and signature
# crates, because upstream webauthn-rs pulls OpenSSL and cannot reach wasm32.
# These are the pins the wasm-auth spike proved on wasm32.
webauthn-rs-proto = { version = "0.5.5", default-features = false }

ciborium = { version = "0.2.2", default-features = false, features = ["std"] }

coset = { version = "0.4.2", default-features = false, features = ["std"] }

url = { version = "2.5.7", default-features = false }

# rsa 0.10 is still a release candidate, so the stable 0.9 line it is. Its
# own `sha2` re-export is used for RS256 so the digest types stay consistent
# inside rsa's tree, which pins sha2 0.10 while the workspace is on 0.11.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }

ed25519-dalek = { version = "2", default-features = false, features = [
    "alloc",
] }

rand_core = { version = "0.6", default-features = false }

# OIDC (ADR 0100 Q3): openidconnect and oauth2 build to wasm32 with default
# features off — no reqwest, no OpenSSL. These are the pins the wasm-auth
# spike validated. `chrono` comes with them as an API type; its `clock`
# feature is deliberately OFF, because `Utc::now()` panics on wasm32 and
# modules read the wall clock through the `Clock` port anyway.
#
# `accept-string-booleans` exists for exactly one provider: Apple documents
# `email_verified` as "a String or Boolean" and sends `"true"`. Without it
# every real Apple sign-in fails ID-token verification with an "invalid
# type: string" that no fake provider reproduces. Pure serde, wasm-safe.
openidconnect = { version = "4.0.1", default-features = false, features = [
    "accept-string-booleans",
] }

chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Facebook Login is OAuth 2.0 without OpenID Connect: no ID token, no
# discovery document, and the profile comes from a Graph call. So Meta
# (#17) uses `oauth2` directly, which is the crate `openidconnect` is
# built on and is already in the tree.
oauth2 = { version = "5.0.0", default-features = false }

# Auth cryptography: argon2id for client secrets (ADR 0100 parameters,
# default features off — no OpenSSL, wasm32-safe, same pin as the spike);
# base64ct for cookie/secret encoding (PHC-compatible, constant-time);
# p256 for ES256 signing and JWK parsing (ADR 0100/0101 stack: `ecdsa`
# gives deterministic RFC 6979 signing, no RNG, no OpenSSL — the pin the
# wasm-auth spike validated on wasm32).
argon2 = { version = "0.6.0", default-features = false, features = [
    "alloc",
    "password-hash",
] }

base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value.
must_use_candidate = { level = "allow", priority = 1 }
