[workspace]
resolver = "3"
# `crates/*` joins with `crates/auth-core` in the next commit (issue #5):
# cargo rejects a `members` glob that matches nothing, so it cannot be
# listed before the directory exists. `spikes/*` stays a member so the
# spike keeps building under the same commands as everything else.
members = ["spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Factory-Zero/auth"

[workspace.dependencies]
# Harness crates, pinned to a harness main commit (8853e07, 2026-09-06).
# They are NOT on crates.io yet; when they publish, these git pins become
# version pins (recorded in PROGRESS.md per BUILD-BRIEF.md).
factory0-core = { git = "https://github.com/Factory-Zero/harness", rev = "8853e071659a967fecdfa95596275188c7bb6725" }
factory0-testing = { git = "https://github.com/Factory-Zero/harness", rev = "8853e071659a967fecdfa95596275188c7bb6725" }
factory0-adapter-sqlite = { git = "https://github.com/Factory-Zero/harness", rev = "8853e071659a967fecdfa95596275188c7bb6725" }

# Versions mirror the harness workspace so the git harness crates and our
# direct dependencies unify into one dependency tree.
# axum runs without tokio on Workers (harness ADR 0001): default features
# off, only the extractor features modules need are enabled.
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "query",
    "form",
    "matched-path",
] }
http = "1.5.0"
bytes = "1.12.1"

# Serialization and diagnostics.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

# SQL. sea-query pinned to the harness's stable 0.32 line (harness ADR
# 0004); `thread-safe` swaps SeaRc = Rc for Arc so query builders can live
# in async handlers.
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }

# Time through the harness `time` stack: `wasm-bindgen` makes
# OffsetDateTime::now_utc() use JS Date on wasm32 — chrono's Utc::now and
# std::time are unusable there (ADR 0100). Modules still read the wall
# clock through the `Clock` port, never directly.
time = { version = "0.3.45", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "wasm-bindgen",
] }

# Traits and errors.
async-trait = "0.1.92"
thiserror = "2.0.20"

# Test-only.
pollster = { version = "0.4", features = ["macro"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value (same call as the harness).
must_use_candidate = { level = "allow", priority = 1 }
