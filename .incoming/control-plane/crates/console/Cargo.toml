[package]
name = "cratefield-console"
description = "The control-plane console module: session guard, login skeleton, and the operator allowlist action"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-access = { path = "../access" }
cratefield-accounts = { path = "../accounts" }
cratefield-catalog = { path = "../catalog" }
cratefield-provisioning = { path = "../provisioning" }
axum = { workspace = true }
http = { workspace = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[dev-dependencies]
cratefield-adapter-sqlite = { git = "https://github.com/Cratefield/harness", rev = "b0858003713c5bc449ef617154ca375842ec1a4b" }
pollster = { version = "0.4", features = ["macro"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
