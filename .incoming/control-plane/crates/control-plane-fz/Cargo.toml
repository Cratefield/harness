# Venture-side `fz` for the control plane (mirrors auth's). Native bin that
# links the venture's own harness so `fz migrations collect`/`doctor` see its
# modules. EXCLUDED from the workspace so the CLI's native-only deps never
# reach a wasm build. Pinned to the SAME harness git rev as the console so
# `cratefield-core` unifies into one type.
[package]
name = "cratefield-control-plane-fz"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[[bin]]
name = "fz"
path = "src/main.rs"

[dependencies]
cratefield-core = { git = "https://github.com/Cratefield/harness", rev = "b0858003713c5bc449ef617154ca375842ec1a4b" }
cratefield-cli = { git = "https://github.com/Cratefield/harness", rev = "b0858003713c5bc449ef617154ca375842ec1a4b" }
cratefield-console = { path = "../console" }
