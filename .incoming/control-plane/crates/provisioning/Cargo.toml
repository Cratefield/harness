[package]
name = "cratefield-provisioning"
description = "The provisioning engine: a module set to a live venture, idempotent and resumable, behind a Deployer port"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-accounts = { path = "../accounts" }
serde = { workspace = true }
sea-query = { workspace = true }

[dev-dependencies]
cratefield-adapter-sqlite = { git = "https://github.com/Cratefield/harness", rev = "b0858003713c5bc449ef617154ca375842ec1a4b" }
pollster = { version = "0.4", features = ["macro"] }
