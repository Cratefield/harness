[package]
name = "cratefield-waitlist"
description = "Cratefield's own early-access waitlist, on the Factory Zero harness waitlist module"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[lints.clippy]
all = "deny"
pedantic = "warn"

[dependencies]
factory0-core = { git = "https://github.com/Cratefield/harness", rev = "c8a87233af66d368d032349460e8e5ad8148c670" }
factory0-runtime-cloudflare = { git = "https://github.com/Cratefield/harness", rev = "c8a87233af66d368d032349460e8e5ad8148c670" }
factory0-module-waitlist = { git = "https://github.com/Cratefield/harness", rev = "c8a87233af66d368d032349460e8e5ad8148c670" }
factory0-adapter-resend = { git = "https://github.com/Cratefield/harness", rev = "c8a87233af66d368d032349460e8e5ad8148c670" }
worker = { version = "0.8.5", default-features = false, features = ["d1"] }
async-trait = "0.1.92"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true


