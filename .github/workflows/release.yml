# crates.io release pipeline (issue #15, ADR 0005). Publishing uses
# trusted publishing: GitHub OIDC (`id-token: write`) authenticates to
# crates.io, so no CARGO_REGISTRY_TOKEN lives in this repo. Setup steps
# the owner takes once per crate: docs/RELEASING.md.
#
# Both commands run on every push to `main`:
# - `release-pr` opens/updates a PR with per-crate version bumps and
#   changelogs for the conventional commits since the last release;
# - `release` is a no-op until that release PR MERGES (the push that
#   merges it is also a push to `main`): then it publishes every crate
#   whose version is not on crates.io yet, in dependency order, and
#   tags `<crate>-v<version>`.
#
# Two human prerequisites, each with its own switch so an unfinished
# setup leaves `main` green with an annotation rather than red:
#
# - Opening the release PR needs a token GitHub lets create PRs. The
#   built-in `GITHUB_TOKEN` may not: "GitHub Actions is not permitted to
#   create or approve pull requests" is a 403 unless the org/repo
#   setting is on. Prefer a `RELEASE_PLZ_TOKEN` secret (a fine-grained
#   PAT or GitHub App token with contents + pull-requests write): it
#   sidesteps the setting *and* makes the release PR run CI, which a
#   `GITHUB_TOKEN`-authored PR never does.
# - Publishing needs crates.io setup, below.
#
# `release` is gated on the repository variable `CRATES_IO_READY`: a
# crate's trusted publisher can only be configured after the crate
# exists, so until the owner has first-published each crate by hand and
# enabled trusted publishing (docs/RELEASING.md, "Owner setup"), every
# `release` run would fail on authentication and leave `main` red.
# `release-pr` is not gated: version bumps and changelogs need no
# registry credentials.

name: Release

on:
  push:
    branches: [main]
  # Exercises the pipeline without waiting for a merge and without
  # publishing: `dry_run` adds `--dry-run` to the release command.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Add --dry-run to the release command"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz:
    name: release-plz (release-pr, then release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # release PR commits, git tags, GitHub releases
      pull-requests: write # open and update the release PR
      id-token: write # crates.io trusted publishing (OIDC)
    env:
      # `secrets` is not a permitted context in a step `if:` — GitHub
      # rejects the whole workflow with "Unrecognized named-value:
      # 'secrets'", so it never parses and never runs. It IS permitted
      # here, so the presence of the token becomes a plain string the
      # steps below can test.
      HAS_RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # Pinned exactly: the action moved from `MarcoIeni/release-plz-action`
      # to `release-plz/action`, which publishes no floating major tag, so
      # `@v0` cannot resolve and the job never starts. Bump deliberately.
      - name: Open or update the release PR
        if: env.HAS_RELEASE_PLZ_TOKEN == 'true' || vars.ACTIONS_MAY_OPEN_PRS == 'true'
        uses: release-plz/action@v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish crates and tag releases (no-op until the release PR merges)
        if: vars.CRATES_IO_READY == 'true'
        uses: release-plz/action@v0.5.133
        with:
          command: release
          # Empty means "no dry run": the action tests this input with
          # `[[ -n ... ]]`, so the string `false` would enable --dry-run
          # and publishing would silently never happen.
          dry_run: ${{ inputs.dry_run && 'true' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Say what is still switched off
        if: always()
        # The secret is passed as a boolean, never interpolated into the
        # script: a secret in a shell line can leak through tracing or an
        # error message.
        env:
          HAS_TOKEN: ${{ env.HAS_RELEASE_PLZ_TOKEN }}
          MAY_OPEN_PRS: ${{ vars.ACTIONS_MAY_OPEN_PRS }}
          CRATES_IO_READY: ${{ vars.CRATES_IO_READY }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] && [ "$MAY_OPEN_PRS" != "true" ]; then
            echo "::notice title=The release PR is off::No RELEASE_PLZ_TOKEN secret and ACTIONS_MAY_OPEN_PRS is not 'true', so release-pr did not run: GitHub refuses PR creation by GITHUB_TOKEN unless the repository setting allows it. See docs/RELEASING.md, Owner setup."
          fi
          if [ "$CRATES_IO_READY" != "true" ]; then
            echo "::notice title=Publishing is off::CRATES_IO_READY is not 'true', so the release command did not run: the crates have not been first-published by hand yet. See docs/RELEASING.md, Owner setup."
          fi
