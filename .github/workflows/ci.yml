name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  cfjs-size:
    # Truncated at the `#` the same way; issue #73.
    name: cf.js size gate (4 KB gzipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tools/cfjs
        run: |
          bun install --frozen-lockfile
          node size.mjs

  migration-guard:
    # No `#` in the name: GitHub truncates a check-run name there, which
    # registered this as `migrations are never edited (issue` — an awkward
    # string to have to name in branch protection. Issue #34.
    name: migrations are never edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the base branch, so it needs history,
          # not the single commit a default checkout fetches.
          fetch-depth: 0
      - name: Never-edit rule
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --no-tags --depth=200 origin "$BASE"
          tools/migration-guard.sh "origin/$BASE"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `fz push send`'s network leg is behind an opt-in feature (issue
      # #184), so the workspace run above never compiles it — and the live
      # proofs (issue #186) would be the first thing to find out.
      - name: fz push send, with its optional transport (issue #184)
        run: cargo clippy -p cratefield-cli --all-targets --features push-send -- -D warnings
      - name: core dependency boundary (ADR 0001)
        run: |
          if cargo tree -p cratefield-core --edges normal | grep -qE '(worker|wasm-bindgen|tokio|reqwest|sqlx|rusqlite) v'; then
            echo "cratefield-core pulled a forbidden dependency:"
            cargo tree -p cratefield-core --edges normal | grep -E '(worker|wasm-bindgen|tokio|reqwest|sqlx|rusqlite) v'
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      # Postgres 16 for the cratefield-adapter-postgres contract tests
      # (issue #18); tests skip cleanly when the URL is unset.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FZ_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The workspace run compiles `fz push send`'s network leg out (issue
      # #184), and with it the tests that hold the wiring only that build
      # has — the clock its deadline is enforced through, and the refusal
      # the *other* build prints in its place.
      - name: fz push send, with its optional transport (issue #184)
        run: cargo test -p cratefield-cli --features push-send
      - name: fz migrations apply against the service container (issue #18)
        run: cargo test -p cratefield-cli-acceptance --features postgres
      - name: Error taxonomy drift check (issue #14)
        run: cargo run -q -p cratefield-core --example errors-doc -- --check
      - name: Compatibility matrix drift check (issue #17)
        run: cargo run -q -p cratefield-cli --example compatibility-doc -- --check
      - name: Push environment table drift check (issue #191)
        run: cargo run -q -p cratefield-push-wiring --example push-env-doc -- --check

  webpush-ntfy:
    # No `#` in the name: GitHub truncates a check-run name there (issue #34).
    name: web push conformance against a real ntfy server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # `docker run`, not a `services:` container. The image's ENTRYPOINT is
      # `ntfy` with no CMD, so the server needs the `serve` argument — and a
      # service container has no way to supply one (the workflow syntax
      # exposes image, env, ports, volumes and `options`, and `options` is
      # `docker create` flags, not the command). Either way the server is
      # reached at `127.0.0.1:<published port>` from a job running directly
      # on the runner, never by a hostname.
      - name: Is Docker available
        id: docker
        run: |
          if docker info > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker is unavailable on this runner; the ntfy conformance leg is skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      # ntfy v2.28.0, pinned by the manifest-list digest. Apache-2.0 /
      # GPL-2.0, a single Go binary that is a UnifiedPush distributor: the
      # UnifiedPush contract it implements ("a distributor endpoint accepts
      # RFC 8030") is documented at https://docs.ntfy.sh/publish/#unifiedpush
      # and https://unifiedpush.org/spec/definitions/.
      #
      # `NTFY_VISITOR_SUBSCRIBER_RATE_LIMITING=false` is pinned rather than
      # left to the default. With it on — as the public ntfy.sh runs — a
      # UnifiedPush publish answers `507` / code 50701 "cannot publish to
      # UnifiedPush topic without previously active subscriber", even with a
      # subscriber stream held open (verified against the public instance,
      # 2026-09-09). It defaults to false self-hosted, and pinning it stops
      # an upstream default change from turning this leg into a silent
      # no-op. The test asserts a 2xx and fails loudly on that 507.
      - name: Start ntfy (UnifiedPush distributor)
        if: steps.docker.outputs.available == 'true'
        run: |
          docker run -d --name ntfy -p 8080:80 \
            -e NTFY_LISTEN_HTTP=:80 \
            -e NTFY_BASE_URL=http://127.0.0.1:8080 \
            -e NTFY_VISITOR_SUBSCRIBER_RATE_LIMITING=false \
            binwiederhier/ntfy@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da \
            serve
          for _ in $(seq 1 30); do
            if curl -sf -m 3 http://127.0.0.1:8080/v1/health | grep -q '"healthy":true'; then
              echo "ntfy is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ntfy never became healthy"
          docker logs ntfy
          exit 1
      # The proof: a real RFC 8030 POST to a server that is not ours, and the
      # body read back out of ntfy's own JSON API and decrypted with the
      # browser-side key the test generated (issue #181).
      #
      # The `grep` is the guard on the guard: the test skips itself when
      # `NTFY_URL` is unset, and a skipped test is a green job that proved
      # nothing.
      - name: Web Push interop against ntfy
        if: steps.docker.outputs.available == 'true'
        env:
          NTFY_URL: http://127.0.0.1:8080
        run: |
          set -o pipefail
          cargo test -p cratefield-adapter-webpush --test ntfy_live -- --nocapture \
            | tee /tmp/ntfy-live.log
          if ! grep -q 'ntfy conformance: decrypted' /tmp/ntfy-live.log; then
            echo "the ntfy leg skipped instead of running: NTFY_URL did not reach the test"
            exit 1
          fi
      # Never the step that fails the job: it is here to explain one that
      # already did.
      - name: ntfy logs
        if: always() && steps.docker.outputs.available == 'true'
        run: docker logs ntfy || true

  # The module conformance kit, run through the reusable workflow so a
  # module built out of tree consumes the identical job (issue #17). The
  # glob covers every module in the workspace, private ones included
  # (ADR 0013), plus the authoring guide's example module (issue #16);
  # the workflow's bash loop word-splits and glob-expands the string.
  conformance:
    name: conformance (module kit)
    uses: ./.github/workflows/conformance.yml
    with:
      module-glob: "crates/module-* examples/module-hello"

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `release.yml` only runs on a push to `main`, so a syntax error in
      # it is invisible: GitHub refuses the file and reports nothing on the
      # PR that introduced it. That is exactly what happened — `secrets` in
      # a step `if:` is not a permitted context, and the release pipeline
      # could not parse from the day it was written.
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc -D warnings (crate docs include their READMEs)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  wasm:
    name: worker-build (examples/venture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      # The push provider-token signer must reach wasm32 on its own (issue
      # #178): the venture build below proves it transitively only for as
      # long as an adapter in that venture uses it.
      - name: Build cratefield-push-auth to wasm
        run: cargo build --target wasm32-unknown-unknown -p cratefield-push-auth
      # Same reason for the FCM adapter (issue #179): its headline is that it
      # runs on an isolate, and no venture in this repo enables the `fcm`
      # feature, so the venture build below never compiles it.
      - name: Build cratefield-adapter-fcm to wasm
        run: cargo build --target wasm32-unknown-unknown -p cratefield-adapter-fcm
      # Same reason for the Web Push adapter (issue #180): it is the crate
      # that pulls `aes-gcm`, `hkdf` and `p256/ecdh`, and no venture in this
      # repo wires it yet, so nothing else would notice a dependency that
      # cannot reach wasm32.
      - name: Build cratefield-adapter-webpush to wasm
        run: cargo build --target wasm32-unknown-unknown -p cratefield-adapter-webpush
      - name: Build example venture to wasm
        working-directory: examples/venture
        run: worker-build --release
      - name: Assert shim exists
        run: test -f examples/venture/build/worker/shim.mjs

  wrangler-dev:
    name: wrangler dev (examples/venture, local D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      - name: Apply local D1 migrations
        working-directory: examples/venture
        run: bunx wrangler d1 migrations apply venture-example --local
      - name: Start wrangler dev
        working-directory: examples/venture
        run: |
          # Throwaway secrets so the signer and the admin UI are on; the
          # example's mailer stays NotConfigured, nothing is ever sent.
          printf 'HARNESS_SECRET=ci-only-secret-0123456789abcdef-xyz\nADMIN_TOKEN=ci-only-admin-token\n' > .dev.vars
          nohup bunx wrangler dev --local > /tmp/wrangler.log 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://127.0.0.1:8787/__health || true)
            if [ "$code" = "200" ]; then echo "worker ready"; exit 0; fi
            sleep 5
          done
          echo "worker never became ready"; cat /tmp/wrangler.log; exit 1
      - name: Curl assertions
        run: |
          set -e
          echo "-- health"
          curl -sf -m 10 http://127.0.0.1:8787/__health | grep -q '"name":"sample"'
          echo "-- ready"
          curl -sf -m 10 http://127.0.0.1:8787/__ready | grep -q '"ok":true'
          echo "-- surface"
          curl -sf -m 10 -D /tmp/surface.headers http://127.0.0.1:8787/__surface \
            | grep -q '"name":"insert"'
          grep -qi '^etag: "' /tmp/surface.headers
          echo "-- ui page"
          curl -sf -m 10 -D /tmp/ui.headers http://127.0.0.1:8787/ui/waitlist/join \
            | grep -q '<form class="cf-form" data-cf-module="waitlist" data-cf-action="join"'
          grep -qi '^content-security-policy:' /tmp/ui.headers
          echo "-- ui submit (validation error re-renders the form)"
          curl -s -m 10 -o /tmp/ui.body -w "%{http_code}" -X POST http://127.0.0.1:8787/ui/waitlist/join \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=not-an-email&product=kontinuum' | grep -q '^422$'
          grep -q 'cf-field--invalid' /tmp/ui.body
          echo "-- ui css"
          curl -sf -m 10 http://127.0.0.1:8787/ui/cf.css | grep -q '@layer cf'
          echo "-- admin: login redirect, login, table"
          curl -s -m 10 -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/ui/admin | grep -q '^303$'
          curl -s -m 10 -o /dev/null -D /tmp/login.headers -X POST http://127.0.0.1:8787/ui/admin/login \
            -H 'origin: http://127.0.0.1:8787' -H 'content-type: application/x-www-form-urlencoded' \
            --data 'token=ci-only-admin-token'
          grep -qi '^set-cookie: cf_admin=' /tmp/login.headers
          COOKIE=$(grep -i '^set-cookie:' /tmp/login.headers | sed 's/^[^:]*: *//' | cut -d';' -f1)
          curl -sf -m 10 -H "cookie: $COOKIE" http://127.0.0.1:8787/ui/admin/waitlist/export \
            | grep -q '<table class="cf-table"'
      - name: cf.js embed against the running worker (issue #73)
        working-directory: tools/cfjs
        run: |
          bun install --frozen-lockfile
          node test.mjs
      - name: Example static site against the running worker (issue #77)
        run: |
          (cd examples/venture/site && python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/site.log 2>&1 &)
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          cd tools/cfjs && node site.mjs
          echo "-- insert"
          curl -sf -m 15 -X POST http://127.0.0.1:8787/v1/sample/rows \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com"}' | grep -q '"id"'
          echo "-- latest"
          curl -sf -m 10 http://127.0.0.1:8787/v1/sample/rows/latest | grep -q 'ci@example.com'
          echo "all assertions passed"
