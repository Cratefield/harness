name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
env:
  CARGO_TERM_COLOR: always
 
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check
 
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
 
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
 
  # The module conformance kit, run through the harness's reusable
  # workflow so this repo's modules pass the identical suite as the
  # harness's own.
  #
  # The harness moved to the Cratefield organisation. The GitHub API and
  # git both follow that rename, but Actions does not resolve a reusable
  # workflow through it: the old address fails the whole run at startup,
  # with no jobs and a generic "workflow file issue". That is what broke CI
  # here, not the module this PR adds.
  #
  # The input is expanded by bash, so several paths can be listed. Neither
  # module crate matches the default `crates/module-*` glob, and
  # `crates/auth-client` is a consumer library rather than a module, so
  # they are named explicitly.
  conformance:
    name: conformance (module kit)
    uses: Cratefield/harness/.github/workflows/conformance.yml@main
    with:
      module-glob: crates/auth-core crates/auth-passkeys
 
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
 
  wasm:
    name: wasm build (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the workspace for wasm32
        run: cargo build --target wasm32-unknown-unknown
      - name: No openssl/reqwest/mio in the wasm tree (BUILD-BRIEF.md)
        run: |
          count=$(cargo tree --target wasm32-unknown-unknown | grep -cE '^\S*(openssl|reqwest|mio) ' || true)
          if [ "$count" != "0" ]; then
            echo "forbidden dependencies in the wasm tree:"
            cargo tree --target wasm32-unknown-unknown | grep -E '(openssl|reqwest|mio) v'
            exit 1
          fi
