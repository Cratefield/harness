# CI for the private module workspace (issue #2). It mirrors the public
# harness's checks and adds the two that matter for a private module: the
# public conformance suite has to pass here too, and nothing may reach the
# network during tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # The conformance suite is part of `cargo test`: every private module
      # ships a `tests/conformance.rs` that runs it, so a module that drifts
      # from the public contract fails here rather than in a venture.
      - run: cargo test --workspace --all-targets

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Every module has to reach a Cloudflare Worker. Building the workspace
      # for wasm32 is the only check that actually proves it.
      - run: cargo build --workspace --target wasm32-unknown-unknown

  boundary:
    name: module dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # ADR 0001/0002: a module sees ports, never a runtime. `cargo tree`
      # defaults to the host target, so a wasm-only dependency (getrandom's
      # wasm_js backend) is correctly invisible here.
      - name: no runtime crates in a module's tree
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))'); do
            echo "checking $crate"
            if cargo tree -p "$crate" --edges normal | grep -qE '(worker|wasm-bindgen|tokio|reqwest|sqlx|rusqlite) v'; then
              echo "$crate pulled a forbidden dependency:"
              cargo tree -p "$crate" --edges normal | grep -E '(worker|wasm-bindgen|tokio|reqwest|sqlx|rusqlite) v'
              exit 1
            fi
          done
