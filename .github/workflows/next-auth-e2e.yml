# End-to-end test for examples/next-auth: a real Chromium drives the whole
# sign-in / refresh / sign-out journey against a locally-run auth-worker.
#
# Deliberately its own workflow rather than a job in ci.yml, so a change to the
# Next example (or to a crate it depends on) reruns it without touching the
# Rust-only CI. The IdP is started the same way the `wrangler-dev` job starts
# one: a local D1, a built Worker, `wrangler dev --local`, poll /__health.
#
# The spec strips `Referrer-Policy` from the IdP's responses: the harness's
# `no-referrer` default makes Chromium send `Origin: null` on a same-origin form
# POST, which auth-core's CSRF guard refuses. That is an IdP bug worked around
# by the spec and tracked separately — see examples/next-auth/README.md.

name: Next auth example e2e

on:
  pull_request:
    paths:
      - 'packages/auth-ts/**'
      - 'examples/next-auth/**'
      - 'crates/auth-worker/**'
      - 'crates/auth-core/**'
      - 'crates/auth-password/**'
      - 'crates/core/**'
      - '.github/workflows/next-auth-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/auth-ts/**'
      - 'examples/next-auth/**'
      - 'crates/auth-worker/**'
      - 'crates/auth-core/**'
      - 'crates/auth-password/**'
      - 'crates/core/**'
      - '.github/workflows/next-auth-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: e2e (Chromium against a local IdP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `wrangler dev` builds the Worker with worker-build; bunx runs wrangler,
      # matching the `wrangler-dev` job in ci.yml.
      - uses: oven-sh/setup-bun@v2
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      - name: "Build @cratefield/auth (the example's file: dependency)"
        run: |
          npm ci
          npm run build -w @cratefield/auth
      - name: Install example dependencies
        working-directory: examples/next-auth
        run: npm ci
      - name: Install Chromium
        working-directory: examples/next-auth
        run: npx playwright install --with-deps chromium
      - name: Write examples/next-auth/idp/.dev.vars
        working-directory: examples/next-auth
        run: npm run idp
      - name: Apply local D1 migrations
        working-directory: examples/next-auth/idp
        run: bunx wrangler d1 migrations apply DB --local
      - name: Start wrangler dev
        working-directory: examples/next-auth/idp
        run: |
          nohup bunx wrangler dev --local --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://127.0.0.1:8787/__health || true)
            if [ "$code" = "200" ]; then echo "worker ready"; exit 0; fi
            sleep 5
          done
          echo "worker never became ready"; cat "$RUNNER_TEMP/wrangler.log"; exit 1
      - name: Register the client and test user
        working-directory: examples/next-auth
        run: npm run setup
      - name: Build the app
        working-directory: examples/next-auth
        run: npm run build
      - name: Run the e2e test
        working-directory: examples/next-auth
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/next-auth/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload wrangler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: ${{ runner.temp }}/wrangler.log
          retention-days: 7
          if-no-files-found: ignore
