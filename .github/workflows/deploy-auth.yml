name: deploy auth

# The deployable auth Worker (auth#41): `main` -> staging, an `auth-v*` tag
# -> production behind the environment approval gate.
#
# Moved here with `Factory-Zero/auth` (ADR 0013). Two things changed:
# `wrangler.toml`, `migrations/` and `smoke.sh` now live beside the crate
# in `crates/auth-worker/`, so every wrangler step runs from there; and the
# production trigger is `auth-v*` rather than `v*`, because a bare `v*` tag
# in this repository is a harness release, not an auth deploy.
#
# `paths` keeps an unrelated harness change from redeploying auth.
on:
  push:
    branches: [main]
    tags: ["auth-v*"]
    paths:
      - "crates/auth-*/**"
      - ".github/workflows/deploy-auth.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  staging:
    name: deploy staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Deploy (staging) + apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crates/auth-worker
          command: deploy
          preCommands: |
            cargo install -q worker-build
            npx wrangler d1 migrations apply DB --remote
      - name: Smoke staging
        working-directory: crates/auth-worker
        run: ./smoke.sh "${{ vars.AUTH_STAGING_URL }}"

  production:
    name: deploy production
    if: startsWith(github.ref, 'refs/tags/auth-v')
    runs-on: ubuntu-latest
    environment: production # the approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Deploy (production) + apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crates/auth-worker
          command: deploy --env production
          preCommands: |
            cargo install -q worker-build
            npx wrangler d1 migrations apply DB --env production --remote
      - name: Smoke production
        working-directory: crates/auth-worker
        run: ./smoke.sh "https://auth.factory0.ventures"
