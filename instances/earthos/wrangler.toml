# The `earthos` auth instance (issue #777): the harness auth Worker
# (`crates/auth-worker`), deployed for EarthOS on EarthOS's own domain with
# EarthOS's own branding, D1, secrets and passkey relying party. Hosted by
# Cratefield on EarthOS's domain (a Cratefield-managed instance), on the
# Earth.OS Cloudflare account (account id 9615fcc65730fceaccc02752e049b7fd),
# which is NOT the Factory0 account. Consumer: the EarthOS Worker
# (World-360/EarthOS.world, served on `earthos.world`, with Aura on
# `aura.earthos.world`), a **confidential** client. Its redirect is
# `https://earthos.world/api/auth/callback` on production and
# `https://staging.earthos.world/api/auth/callback` on staging (route
# `app/api/auth/callback/route.ts`). Each environment's client is registered
# separately with that environment's own redirect URI.
#
# Deployed by `.github/workflows/deploy-auth.yml` from this directory:
# `main` -> staging (top level), an `auth-v*` tag -> production
# (`[env.production]`, behind the `auth-earthos-production` approval gate).
# The Cloudflare account is supplied by the `auth-earthos-<env>` GitHub
# environment secrets (`CLOUDFLARE_ACCOUNT_ID` = the id above, plus
# `CLOUDFLARE_API_TOKEN`), not by a key in this file, as for the other
# instances. Wrangler does not inherit `[vars]` into an environment, so both
# blocks carry the full set. Every variable is documented in
# `crates/auth-worker/README.md`.
#
# Both D1s exist on the Earth.OS account (created 2026-10-18). Still needed
# per environment (docs/auth/MANAGED-INSTANCES.md), by name only:
# - HARNESS_SECRET, ADMIN_TOKEN, AUTH_CORE_SIGNING_KEYS (+
#   AUTH_CORE_SIGNING_KEY_ACTIVE), OWLPOST_API_KEY, TURNSTILE_SECRET.
#   Per environment: `wrangler secret put <NAME> [--env production]`.
# - The GitHub environments `auth-earthos-staging` and
#   `auth-earthos-production` (production with required reviewers), each with
#   CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# - The custom domains below on the Earth.OS account (zone earthos.world).
# - Owlpost: verify the sending domain `send.earthos.world` (DNS records from
#   Owlpost go to the earthos.world zone) and create the API key for it.
# - A Turnstile widget for `auth.earthos.world` and
#   `auth-staging.earthos.world`.
name = "earthos-auth"
main = "../../crates/auth-worker/build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
# Staging's own hostname; production's is in `[env.production]`.
route = { pattern = "auth-staging.earthos.world", custom_domain = true }

# `worker-build` compiles the package in its working directory, so the build
# runs in the crate and `main` points at the shim it writes there. Every
# instance builds the same, unmodified crate.
[build]
cwd = "../../crates/auth-worker"
command = "cargo install -q worker-build && worker-build --release"
watch_dir = "../../crates/auth-worker/src"

[observability]
enabled = true

# --- Staging (deployed from `main`) ---

# Workers Rate Limiting backs the harness's throttle; readiness refuses the
# instance unless a limiter resolves (harness #437). Namespace ids are per
# account and must not collide with another instance's on the same account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1601"

[ratelimits.simple]
limit = 30
period = 60

[[d1_databases]]
binding = "DB"
database_name = "earthos-auth-staging"
database_id = "efaede03-3097-4c42-99a3-340ffb983ace"
migrations_dir = "../../crates/auth-worker/migrations"

# The meta-module drains Meta deletion jobs on a schedule.
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENV = "staging"
AUTH_PUBLIC_URL = "https://auth-staging.earthos.world"
AUTH_CORE_ISSUER = "https://auth-staging.earthos.world"
AUTH_VENTURE_NAME = "earthos-auth"
AUTH_CORS_ORIGINS = "https://staging.earthos.world,https://aura.earthos.world"
AUTH_BRAND_NAME = "EarthOS"
AUTH_BRAND_FOOTER = "EarthOS"
# The Aura Nightforest look (EarthOS app/aura-nightforest.css, dark). No web-font
# URL: EarthOS self-hosts its fonts and never sends browsers to a font CDN.
AUTH_BRAND_BACKGROUND = "#080E0B"
AUTH_BRAND_TEXT = "#EDE6D6"
AUTH_BRAND_ACCENT = "#D4AF6A"
AUTH_BRAND_ACCENT_TEXT = "#0A110D"
AUTH_BRAND_DANGER = "#E8907A"
AUTH_BRAND_SCHEME = "dark"
AUTH_BRAND_RADIUS = "14"
AUTH_BRAND_FONT_BODY = "Figtree, system-ui, sans-serif"
AUTH_BRAND_FONT_DISPLAY = "Figtree, system-ui, sans-serif"
AUTH_BRAND_FONT_MONO = "'Geist Mono', ui-monospace, Menlo, monospace"
AUTH_BRAND_LOGO_URL = "https://earthos.world/icons/icon-192.png"
AUTH_BRAND_PRIVACY_URL = "https://earthos.world/en/privacy"
AUTH_BRAND_TERMS_URL = "https://earthos.world/en/terms"
AUTH_CORE_LOGIN_METHODS = "passkey,magic-link"
AUTH_PASSKEYS_RP_ID = "auth-staging.earthos.world"
AUTH_PASSKEYS_ORIGINS = "https://auth-staging.earthos.world"
# Staging leaves AUTH_MAILER unset: the Worker then uses Owlpost as soon as
# the OWLPOST_API_KEY secret exists, and boots without mail until then
# (production keeps `owlpost` and refuses to boot without the key).
MAIL_FROM = "EarthOS <no-reply@send.earthos.world>"
AUTH_MAGIC_LINK_PUBLIC_BASE = "https://auth-staging.earthos.world"
AUTH_MAGIC_LINK_MAIL_FROM = "EarthOS <sign-in@send.earthos.world>"
AUTH_PASSWORD_PUBLIC_BASE = "https://auth-staging.earthos.world"
AUTH_PASSWORD_MAIL_FROM = "EarthOS <sign-in@send.earthos.world>"
AUTH_OIDC_REDIRECT_BASE = "https://auth-staging.earthos.world"
AUTH_META_REDIRECT_BASE = "https://auth-staging.earthos.world"
# AUTH_BRAND_SUPPORT_EMAIL is not set: support@earthos.world does not receive mail yet.

# --- Production (deployed from an `auth-v*` tag, behind the approval gate) ---
[env.production]
route = { pattern = "auth.earthos.world", custom_domain = true }

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1602"

[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.d1_databases]]
binding = "DB"
database_name = "earthos-auth-production"
database_id = "d0818b89-6943-4323-aa3a-8b830bdfbd22"
migrations_dir = "../../crates/auth-worker/migrations"

[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.vars]
ENV = "production"
AUTH_PUBLIC_URL = "https://auth.earthos.world"
AUTH_CORE_ISSUER = "https://auth.earthos.world"
AUTH_VENTURE_NAME = "earthos-auth"
AUTH_CORS_ORIGINS = "https://earthos.world,https://aura.earthos.world"
AUTH_BRAND_NAME = "EarthOS"
AUTH_BRAND_FOOTER = "EarthOS"
# The Aura Nightforest look (EarthOS app/aura-nightforest.css, dark). No web-font
# URL: EarthOS self-hosts its fonts and never sends browsers to a font CDN.
AUTH_BRAND_BACKGROUND = "#080E0B"
AUTH_BRAND_TEXT = "#EDE6D6"
AUTH_BRAND_ACCENT = "#D4AF6A"
AUTH_BRAND_ACCENT_TEXT = "#0A110D"
AUTH_BRAND_DANGER = "#E8907A"
AUTH_BRAND_SCHEME = "dark"
AUTH_BRAND_RADIUS = "14"
AUTH_BRAND_FONT_BODY = "Figtree, system-ui, sans-serif"
AUTH_BRAND_FONT_DISPLAY = "Figtree, system-ui, sans-serif"
AUTH_BRAND_FONT_MONO = "'Geist Mono', ui-monospace, Menlo, monospace"
AUTH_BRAND_LOGO_URL = "https://earthos.world/icons/icon-192.png"
AUTH_BRAND_PRIVACY_URL = "https://earthos.world/en/privacy"
AUTH_BRAND_TERMS_URL = "https://earthos.world/en/terms"
AUTH_CORE_LOGIN_METHODS = "passkey,magic-link"
AUTH_PASSKEYS_RP_ID = "earthos.world"
AUTH_PASSKEYS_ORIGINS = "https://auth.earthos.world"
AUTH_MAILER = "owlpost"
MAIL_FROM = "EarthOS <no-reply@send.earthos.world>"
AUTH_MAGIC_LINK_PUBLIC_BASE = "https://auth.earthos.world"
AUTH_MAGIC_LINK_MAIL_FROM = "EarthOS <sign-in@send.earthos.world>"
AUTH_PASSWORD_PUBLIC_BASE = "https://auth.earthos.world"
AUTH_PASSWORD_MAIL_FROM = "EarthOS <sign-in@send.earthos.world>"
AUTH_OIDC_REDIRECT_BASE = "https://auth.earthos.world"
AUTH_META_REDIRECT_BASE = "https://auth.earthos.world"
# AUTH_BRAND_SUPPORT_EMAIL: see the staging note above.
