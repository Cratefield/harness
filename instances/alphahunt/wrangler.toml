# The `alphahunt` auth instance (issue #777): the harness auth Worker
# (`crates/auth-worker`), deployed for Alphahunt on Alphahunt's own domain
# with Alphahunt's own branding, D1, secrets and passkey relying party.
# Hosted by Cratefield on Alphahunt's domain (a Cratefield-managed instance).
#
# Deployed by `.github/workflows/deploy-auth.yml` from this directory:
# `main` -> staging (top level), an `auth-v*` tag -> production
# (`[env.production]`, behind the `auth-alphahunt-production` approval gate).
# Wrangler does not inherit `[vars]` into an environment, so both blocks
# carry the full set. Every variable is documented in
# `crates/auth-worker/README.md`.
#
# Provisioned on the Cloudflare account that holds alphahunt.ing: both D1
# databases exist (ids below) and staging is migrated. Still needed before
# production (docs/auth/MANAGED-INSTANCES.md):
# - The secrets, by name only: HARNESS_SECRET, ADMIN_TOKEN,
#   AUTH_CORE_SIGNING_KEYS (+ AUTH_CORE_SIGNING_KEY_ACTIVE), OWLPOST_API_KEY,
#   TURNSTILE_SECRET, and the OIDC/Meta client secrets once those methods
#   are enabled. Per environment: `wrangler secret put <NAME> [--env production]`.
# - The custom domains (routes below) on the Cloudflare account that holds
#   alphahunt.ing, the Turnstile site for both hostnames, and the Owlpost
#   sending domain `send.alphahunt.ing`.
name = "alphahunt-auth"
main = "../../crates/auth-worker/build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
# Staging's own hostname; production's is in `[env.production]`.
route = { pattern = "auth-staging.alphahunt.ing", custom_domain = true }

# `worker-build` compiles the package in its working directory, so the build
# runs in the crate and `main` points at the shim it writes there. Every
# instance builds the same, unmodified crate.
[build]
cwd = "../../crates/auth-worker"
command = "cargo install -q worker-build && worker-build --release"
watch_dir = "../../crates/auth-worker/src"

[observability]
enabled = true

# --- Staging (deployed from `main`) ---

# Workers Rate Limiting backs the harness's throttle; readiness refuses the
# instance unless a limiter resolves (harness #437). Namespace ids are per
# account and must not collide with another instance's on the same account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1201"

[ratelimits.simple]
limit = 30
period = 60

[[d1_databases]]
binding = "DB"
database_name = "alphahunt-auth-staging"
database_id = "f62881b8-76c2-4a13-bf92-974af569b4e6"
migrations_dir = "../../crates/auth-worker/migrations"

# The meta-module drains Meta deletion jobs on a schedule.
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENV = "staging"
AUTH_PUBLIC_URL = "https://auth-staging.alphahunt.ing"
AUTH_CORE_ISSUER = "https://auth-staging.alphahunt.ing"
AUTH_VENTURE_NAME = "alphahunt-auth"
AUTH_CORS_ORIGINS = "https://alphahunt.ing,https://app.alphahunt.ing"
AUTH_BRAND_NAME = "Alphahunt"
AUTH_BRAND_FOOTER = "Alphahunt"
AUTH_CORE_LOGIN_METHODS = "passkey,magic-link"
AUTH_PASSKEYS_RP_ID = "auth-staging.alphahunt.ing"
AUTH_PASSKEYS_ORIGINS = "https://auth-staging.alphahunt.ing"
# Staging leaves AUTH_MAILER unset: the Worker then uses Owlpost as soon as
# the OWLPOST_API_KEY secret exists, and boots without mail until then
# (production keeps `owlpost` and refuses to boot without the key).
MAIL_FROM = "Alphahunt <no-reply@send.alphahunt.ing>"
AUTH_MAGIC_LINK_PUBLIC_BASE = "https://auth-staging.alphahunt.ing"
AUTH_MAGIC_LINK_MAIL_FROM = "Alphahunt <sign-in@send.alphahunt.ing>"
AUTH_PASSWORD_PUBLIC_BASE = "https://auth-staging.alphahunt.ing"
AUTH_PASSWORD_MAIL_FROM = "Alphahunt <sign-in@send.alphahunt.ing>"
AUTH_OIDC_REDIRECT_BASE = "https://auth-staging.alphahunt.ing"
AUTH_META_REDIRECT_BASE = "https://auth-staging.alphahunt.ing"
# Alphahunt's look (issue #840), from alphahunt.ing's own tokens: ink
# #0C0C0D, paper #ECEAE4, lime #D8FF3C, red #FF3B2F; Archivo Black for
# headings, Geist for text, JetBrains Mono for labels; square corners.
# The logo is the site's mark as a PNG (mail clients drop SVG).
AUTH_BRAND_LOGO_URL = "https://alphahunt.ing/assets/icon-512.png"
AUTH_BRAND_ACCENT = "#D8FF3C"
AUTH_BRAND_ACCENT_TEXT = "#0C0C0D"
AUTH_BRAND_BACKGROUND = "#0C0C0D"
AUTH_BRAND_TEXT = "#ECEAE4"
AUTH_BRAND_DANGER = "#FF3B2F"
AUTH_BRAND_SCHEME = "dark"
AUTH_BRAND_RADIUS = "0"
AUTH_BRAND_FONT_DISPLAY = "'Archivo Black', 'Arial Black', Impact, sans-serif"
AUTH_BRAND_FONT_BODY = "Geist, system-ui, -apple-system, 'Segoe UI', sans-serif"
AUTH_BRAND_FONT_MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
AUTH_BRAND_FONT_CSS_URL = "https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
AUTH_BRAND_SUPPORT_EMAIL = "contact@alphahunt.ing"
# The sign-in mail: a dark header band with the mark, paper card, lime
# button, all inline so Gmail keeps it.
MAIL_THEME = '''{"wordmark":"Alphahunt","site_url":"https://alphahunt.ing","logo_alt":"Alphahunt","logo_width":36,"logo_height":36,"header_bg":"#0C0C0D","header_text":"#ECEAE4","light":{"bg":"#ECEAE4","card":"#F7F6F2","border":"#D3D0C7","ink":"#0C0C0D","text":"#2A2A2C","muted":"#55554F","accent":"#0C0C0D","button":"#D8FF3C","button_text":"#0C0C0D","code_bg":"#ECEAE4"},"dark":{"bg":"#0C0C0D","card":"#141416","border":"#2A2A2C","ink":"#ECEAE4","text":"#BDBBB5","muted":"#8A8A86","accent":"#D8FF3C","button":"#D8FF3C","button_text":"#0C0C0D","code_bg":"#0C0C0D"},"font":"Geist,'Helvetica Neue',Helvetica,Arial,sans-serif","mono":"'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace","display_font":"'Archivo Black','Arial Black',Impact,'Helvetica Neue',Arial,sans-serif","radius":0,"button_radius":0,"contact":"contact@alphahunt.ing"}'''
# AUTH_BRAND_PRIVACY_URL = "https://alphahunt.ing/privacy"   # needs-human: the page does not exist yet (404), uncomment once it does
# AUTH_BRAND_TERMS_URL = "https://alphahunt.ing/terms"   # needs-human: the page does not exist yet (404), uncomment once it does

# --- Production (deployed from an `auth-v*` tag, behind the approval gate) ---
[env.production]
route = { pattern = "auth.alphahunt.ing", custom_domain = true }

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1202"

[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.d1_databases]]
binding = "DB"
database_name = "alphahunt-auth-production"
database_id = "abcb0141-b916-4dd9-8cb4-daf0cb6e7563"
migrations_dir = "../../crates/auth-worker/migrations"

[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.vars]
ENV = "production"
AUTH_PUBLIC_URL = "https://auth.alphahunt.ing"
AUTH_CORE_ISSUER = "https://auth.alphahunt.ing"
AUTH_VENTURE_NAME = "alphahunt-auth"
