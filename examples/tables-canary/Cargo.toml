# GENERATED by `fz build` from the venture manifest. Do not edit by
# hand: re-run `fz build` to regenerate. The module set is
# ``.
[package]
name = "tables-canary"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fz"
path = "src/fz_main.rs"
# Every venture's `fz` is called `fz`, so two of them in one
# workspace document to the same path and `cargo doc` refuses
# both. It is a thin CLI shim over `cratefield-cli`; its rustdoc
# is not what anybody reads.
doc = false

[dependencies]
cratefield = { path = "../../crates/facade", features = [
    "cloudflare",
    "tables-api",
] }
worker = { version = "0.8.5", default-features = false, features = ["d1"] }
cratefield-cli = { path = "../../crates/cli" }

[dev-dependencies]
cratefield = { path = "../../crates/facade", features = ["testing"] }
# Somewhere to run an async test. A handler is async and so is
# every kit helper that drives one, so without a runtime a
# venture's first route test does not compile. `pollster` because
# it is the smallest thing that blocks on a future and the
# Workers runtime is single-threaded anyway; swap it for `tokio`
# if a venture wants one.
pollster = { version = "0.4", features = ["macro"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
