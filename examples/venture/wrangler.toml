name = "venture-example"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cargo install -q worker-build && worker-build"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "venture-example"
database_id = "local-venture-example"
migrations_dir = "migrations"

# The Realtime port (issue #103). One class per venture; `RoomDriver` in
# `cratefield-runtime-cloudflare` is what it forwards to.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

# A class using the WebSocket hibernation API has to be declared in a
# migration, or the runtime will not accept a socket on its behalf.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]

# The sidecar-mount shape of the same example (issue #258). The default
# deployment above binds nothing, which is the honest default: mounting a
# sidecar is deployment configuration (ADR 0009), not composition. Run the
# mounted shape locally with:
#
#   (cd ../sidecar-slow-events && bunx wrangler dev --local --port 8799 &)
#   bunx wrangler dev --local --env sidecar
#
# `port` is a local-dev-only key: it points this session's binding at the
# sidecar's own `wrangler dev` (the cross-session dev registry does the
# dialling). It never reaches a production deploy, where `service` is the
# deployed Worker's name.
#
# d1, the DO class and the DO migration are repeated rather than inherited:
# wrangler treats them as non-inheritable into named environments, and a
# missing D1 binding here would silently boot the host without its database.
[env.sidecar.vars]
HARNESS_SIDECARS = '{"probe":"SLOW"}'

[[env.sidecar.services]]
binding = "SLOW"
service = "sidecar-slow-events"
port = 8799

[[env.sidecar.d1_databases]]
binding = "DB"
database_name = "venture-example"
database_id = "local-venture-example"
migrations_dir = "migrations"

[[env.sidecar.durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

[[env.sidecar.migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]
