[package]
name = "venture"
description = "Smallest complete Factory Zero venture: the wasm + D1 canary"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` for worker-build's wasm output; `rlib` so the native example
# crate can link the sample module verbatim (issue #19).
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# One dependency, not six. This is the front door a venture is meant to
# use, and building the wasm canary through it is how we know the facade
# actually works on Workers rather than only in a unit test.
#
# `resend` is here because the example mounts modules that require a
# Mailer; with no key the adapter is NotConfigured, which is what an
# example wants: the port exists, nothing is ever sent.
#
# `push-wiring` is here because the example assembles the `Push` port from
# the environment (issue #191). With nothing configured the router answers
# `NotConfigured` for every recipient — which is exactly what the wasm build
# and the `wrangler dev` smoke should exercise: the assembled router boots.
cratefield = { path = "../../crates/facade", version = "0.2", features = [
    "cloudflare",
    "ui",
    "resend",
    "push-wiring",
    "email-signup",
    "waitlist",
    # The notifications module (issue #182). Nothing is configured here,
    # so `/v1/notifications` answers 401 (no auth issuer) and any send
    # would dead-letter as `not_configured` — which is what the wasm build
    # and the `wrangler dev` smoke should cover: the module boots, its
    # migrations apply, and it says so rather than pretending.
    "notifications",
    # The organizations module (issue #652): mounted below with a staff
    # organization and a guarded admin route, through `cratefield::orgs`.
    "orgs",
    # The CRM module (issue #572): contacts, organisations and tags, mounted
    # below through `cratefield::crm`. It takes no settings, and every route
    # it declares is an admin action, so with no `ADMIN_TOKEN` configured
    # they answer 401 — which is what the wasm build and the `wrangler dev`
    # smoke should cover: the module boots and says so rather than
    # pretending.
    "crm",
] }
async-trait = { workspace = true }
# The `#[durable_object]` macro expands to a `wasm_bindgen` export, so the
# crate declaring the class needs it in scope (issue #103).
wasm-bindgen = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
# The `HttpClient` port's request body type: the sample module's transport
# probe (issue #229) is the only thing here that builds one.
bytes = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
worker = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
# The streaming canary (issue #585): `POST /upload` hashes the body as it
# streams past, and `GET /download` yields chunks from a hand-written
# `Stream`, so the example names the hash and the trait directly.
sha2 = { workspace = true }
futures-core = { workspace = true }

[dev-dependencies]
# The admin-route test (`tests/admin_route.rs`) drives the router over the
# kit's fake ports and runs every dialect the environment offers: SQLite
# always, Postgres when `FZ_TEST_POSTGRES_URL` is set.
cratefield-testing = { workspace = true, features = ["postgres"] }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
