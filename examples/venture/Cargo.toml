[package]
name = "venture"
description = "Smallest complete Factory Zero venture: the wasm + D1 canary"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` for worker-build's wasm output; `rlib` so the native example
# crate can link the sample module verbatim (issue #19).
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# One dependency, not six. This is the front door a venture is meant to
# use, and building the wasm canary through it is how we know the facade
# actually works on Workers rather than only in a unit test.
#
# `resend` is here because the example mounts modules that require a
# Mailer; with no key the adapter is NotConfigured, which is what an
# example wants: the port exists, nothing is ever sent.
#
# `push-wiring` is here because the example assembles the `Push` port from
# the environment (issue #191). With nothing configured the router answers
# `NotConfigured` for every recipient — which is exactly what the wasm build
# and the `wrangler dev` smoke should exercise: the assembled router boots.
cratefield = { path = "../../crates/facade", version = "0.1.0", features = [
    "cloudflare",
    "ui",
    "resend",
    "push-wiring",
    "email-signup",
    "waitlist",
] }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
worker = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
