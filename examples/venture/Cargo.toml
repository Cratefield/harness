[package]
name = "venture"
description = "Smallest complete Factory Zero venture: the wasm + D1 canary"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` for worker-build's wasm output; `rlib` so the native example
# crate can link the sample module verbatim (issue #19).
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
cratefield-module-email-signup = { workspace = true }
cratefield-module-waitlist = { workspace = true }
cratefield-ui = { workspace = true }
# The example mounts modules that require a Mailer; the Resend adapter with
# no key is NotConfigured, which is what the example wants: the port exists,
# nothing is ever sent.
cratefield-adapter-resend = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
worker = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
