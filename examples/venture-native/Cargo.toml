[package]
name = "venture-native"
description = "The example venture as a native binary: same modules, runtime-native on tokio"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Native-only deps are target-gated (the pattern `cratefield-adapter-postgres`
# uses) so `cargo tree --target wasm32-unknown-unknown --workspace` stays
# free of tokio/reqwest/redis/sqlx/rusqlite even with this crate as a
# member — the proof the brief demands.
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
venture = { path = "../venture" }
cratefield-core = { workspace = true }
# `push` (issue #191): `Native::push_from_env()`, so the native canary
# exercises the same `build_push` the Worker example does — and so CI
# compiles the native twin of the wiring at all.
cratefield-runtime-native = { path = "../../crates/runtime-native", features = [
    "push",
] }
cratefield-adapter-postgres = { workspace = true }
cratefield-adapter-sqlite = { workspace = true }
cratefield-adapter-resend = { workspace = true }
cratefield-adapter-turnstile = { workspace = true }
cratefield-module-email-signup = { workspace = true }
cratefield-module-waitlist = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "signal"] }
http = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
