# The issue #438 canary: a minimal Worker that drives the real compiled
# `cratefield_runtime_cloudflare::D1Database` adapter against a D1 binding
# under workerd (miniflare), and fails loudly if a BLOB round trip loses a
# byte. Not generated by `fz build` — it composes no modules, it exists to
# exercise the adapter, auth-core's session store and `Secrets` directly.
[package]
name = "d1-blob-canary"
version = "0.1.0"
edition = "2021"
publish = false
# `cargo deny` refuses an unlicensed crate even when it is `publish = false`,
# and every other example inherits the workspace's. Edition stays 2021 here
# on purpose: this crate is pinned to what the `worker` template builds with.
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
# The session path binds `token_hash` as `Vec<u8>` (store.rs insert_session /
# session_by_token_hash) — the production byte-bearing path on D1.
factory0-auth-core = { path = "../../crates/auth-core" }
# `Secrets::put`/`get` bind nonce and ciphertext as bytes.
cratefield-secrets = { workspace = true }
cratefield-kms = { workspace = true }
# `Kms` is an `#[async_trait]` trait; the canary's stand-in KMS impl needs
# the same attribute.
async-trait = { workspace = true }
worker = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
