# The template's own CI. In this monorepo the harness's CI runs the same
# gates against the in-tree copy; this file exists so the extracted
# template is a working repository the moment it is copied — the issue's
# acceptance is that `cargo test` and `worker-build --release` pass from
# a fresh clone, and CI is what keeps them passing after that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The conformance kit runs against the shared kit; Postgres parity
      # runs wherever FZ_TEST_POSTGRES_URL points. Enable the service
      # container (and the `postgres` feature) when the module needs it —
      # the cratefield-testing README documents the leg.

  wasm:
    name: worker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install worker-build
        run: cargo install -q --locked worker-build
      - run: worker-build --release
      - name: Assert shim exists
        run: test -f build/worker/shim.mjs
