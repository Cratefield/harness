# Clippy configuration for every crate in the workspace.
#
# ADR 0007 bans ambient request state. `static mut` and `thread_local!` are
# additionally unusable in core and module crates because they forbid
# `unsafe_code` (accessing a `static mut` requires an unsafe block) and
# `static_mut_refs` is warn-by-default in edition 2024.
#
# Crates that have a legitimate, non-request-scoped need for interior
# mutability (e.g. `cratefield-adapter-sqlite` guarding a `rusqlite` connection,
# or `cratefield-testing` recording fakes) must annotate the specific item with
# `#[allow(clippy::disallowed_types)]` and a justification comment.

disallowed-macros = [
    { path = "std::thread_local", reason = "ADR 0007: no ambient per-isolate request state" },
]

disallowed-types = [
    { path = "std::sync::Mutex", reason = "shared mutable state; request state travels in Scope (ADR 0007)" },
]

# Proper nouns, not identifiers. Without this, clippy::doc_markdown (pedantic)
# asks for backticks around every mention of WebAuthn or LinkedIn in prose.
# The union of the lists the auth service and the LinkedIn module each kept
# in their own repositories before the consolidation (ADR 0013); `".."` keeps
# clippy's own defaults alongside them.
doc-valid-idents = [
    "WebAuthn",
    "OpenSSL",
    "OAuth",
    "OpenID",
    "PKCE",
    "EdDSA",
    "RustCrypto",
    "LinkedIn",
    "RestLi",
    "XChaCha",
    "DevTestCo",
    "PostgreSQL",
    "..",
]
