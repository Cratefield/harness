# Mirrors the public harness's clippy configuration (ADR 0007): no ambient
# per-request state, no shared mutable state outside a Scope. Test fakes that
# genuinely need interior mutability use RwLock, or annotate the specific item
# with #[allow(clippy::disallowed_types)] and a reason.

disallowed-macros = [
    { path = "std::thread_local", reason = "ADR 0007: no ambient per-isolate request state" },
]

disallowed-types = [
    { path = "std::sync::Mutex", reason = "shared mutable state; request state travels in Scope (ADR 0007)" },
]

# Proper nouns, not identifiers. Without this, clippy::doc_markdown (pedantic)
# asks for backticks around every mention of LinkedIn in prose.
doc-valid-idents = ["LinkedIn", "OAuth", "RestLi", "XChaCha", "DevTestCo", "PostgreSQL", ".."]
