[package]
name = "wasm-auth-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Spike crate for auth issue #2: webauthn/openidconnect/argon2 on wasm32 Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
serde_bytes = "0.11"
http = "1"
bytes = "1"
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Q2: pure-Rust WebAuthn relying-party verification.
webauthn-rs-proto = { version = "0.5.5", default-features = false }
base64urlsafedata = "0.5"
ciborium = "0.2"
coset = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha2 = "0.10"

# Q3: openidconnect through the harness HttpClient port.
openidconnect = { version = "4.0", default-features = false }
futures-channel = "0.3"

# Q4: argon2 cost measurement.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

# Host-only fixture minting (examples are never built for the wasm target).
[dev-dependencies]
