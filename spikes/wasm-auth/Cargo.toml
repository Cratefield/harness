[package]
name = "wasm-auth-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike crate for auth issue #2: webauthn/openidconnect/argon2 on wasm32 Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
serde_bytes = "0.11"
# Q2: pure-Rust WebAuthn relying-party verification.
webauthn-rs-proto = { version = "0.5.5", default-features = false }
base64urlsafedata = "0.5"
ciborium = "0.2"
coset = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha2 = "0.10"

# Host-only fixture minting (examples are never built for the wasm target).
[dev-dependencies]
