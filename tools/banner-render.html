<!DOCTYPE html>
<!-- Source for assets/readme-banner.png and assets/social-preview.png.
     Regenerate with tools/render-banner.sh.
     Query params: k=kicker t=title s=subtitle m=meta h=height (400 | 640)

     Deliberately the same visual system as cratefield.com: the 56px mesh, the
     field of modules and ports resolving into one binary, and the one accent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0A0A0B; overflow: hidden; }
  .b {
    position: relative; width: 1280px; color: #EDEBE6;
    font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .mesh {
    position: absolute; inset: 0;
    background-image: linear-gradient(#16161a 1px, transparent 1px), linear-gradient(90deg, #16161a 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 58% 100% at 78% 45%, #000 25%, transparent 100%);
  }
  .c { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 48px 60px; }
  .top { display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: .22em; font-weight: 500; }
  .top svg { display: block; }
  .mid { align-self: center; }
  h1 { margin: 0 0 14px; font-weight: 700; letter-spacing: -.035em; line-height: 1; max-width: 700px; }
  .tag { font-size: 21px; line-height: 1.45; color: #A9A8A5; max-width: 640px; margin: 0; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .12em; color: #8A8A8E; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #4C6FFF; }

  /* The field: modules and ports compiling into one binary. */
  .field { position: absolute; display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; }
  .field i { display: block; width: 52px; height: 52px; border: 1px solid #2A2A2E; background: #0E0E10; }
  .field i.on { border-color: #4C6FFF; background: #141416; }
  .out { position: absolute; width: 226px; border: 1px solid #EDEBE6; background: #0E0E10; padding: 9px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #EDEBE6; text-align: center; }
  .arrow { position: absolute; color: #4C6FFF; font-family: 'IBM Plex Mono', monospace; font-size: 16px; }
</style>
</head>
<body>
<div class="b" id="b">
  <div class="mesh"></div>
  <div class="field" id="field"></div>
  <div class="arrow" id="arrow">&darr;</div>
  <div class="out" id="out">acme_backend.wasm</div>
  <div class="c">
    <div class="top">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#EDEBE6"/><rect x="9" y="1" width="6" height="6" fill="#EDEBE6"/><rect x="17" y="1" width="6" height="6" fill="#3A3A3F"/><rect x="1" y="9" width="6" height="6" fill="#EDEBE6"/><rect x="9" y="9" width="6" height="6" fill="#4C6FFF"/><rect x="17" y="9" width="6" height="6" fill="#EDEBE6"/><rect x="1" y="17" width="6" height="6" fill="#3A3A3F"/><rect x="9" y="17" width="6" height="6" fill="#EDEBE6"/><rect x="17" y="17" width="6" height="6" fill="#EDEBE6"/></svg>
      <span id="k">CRATEFIELD · HARNESS</span>
    </div>
    <div class="mid">
      <h1 id="t">The open-source core.</h1>
      <p class="tag" id="s"></p>
    </div>
    <div class="bottom">
      <div id="m"></div>
      <div>MIT</div>
    </div>
  </div>
  <div class="rule"></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var H = parseInt(q.get('h') || '400', 10);

  document.documentElement.style.height = H + 'px';
  document.body.style.width = '1280px';
  document.body.style.height = H + 'px';
  var b = document.getElementById('b');
  b.style.height = H + 'px';

  if (q.get('k')) document.getElementById('k').textContent = q.get('k');
  if (q.get('t')) document.getElementById('t').textContent = q.get('t');
  document.getElementById('s').textContent = q.get('s') || '';
  document.getElementById('m').textContent = q.get('m') || '';

  // Type and furniture scale with the canvas so both sizes stay balanced.
  var tall = H >= 560;
  document.getElementById('t').style.fontSize = (tall ? 66 : 54) + 'px';
  document.getElementById('s').style.fontSize = (tall ? 24 : 21) + 'px';
  document.querySelector('.c').style.padding = (tall ? 64 : 48) + 'px 60px';

  var field = document.getElementById('field');
  var lit = { 1: 1, 4: 1, 6: 1, 11: 1, 13: 1 };
  for (var i = 0; i < 16; i++) {
    var cell = document.createElement('i');
    if (lit[i]) cell.className = 'on';
    field.appendChild(cell);
  }
  // 4 rows of 52px + 3 gaps of 6 = 226px of field, then the arrow and the output.
  var fieldH = 226, outH = 36, arrowH = 26, stackH = fieldH + arrowH + outH;
  var top = Math.round((H - stackH) / 2);
  field.style.right = '60px';
  field.style.top = top + 'px';
  var arrow = document.getElementById('arrow');
  arrow.style.right = '168px';
  arrow.style.top = (top + fieldH + 2) + 'px';
  var out = document.getElementById('out');
  out.style.right = '60px';
  out.style.top = (top + fieldH + arrowH) + 'px';

  document.documentElement.setAttribute('data-banner-ready', '1');
})();
</script>
</body>
</html>
